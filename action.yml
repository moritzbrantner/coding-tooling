name: Run coding tooling
description: Run version-pinned repository validation, environment fingerprinting/verification, conformance, findings, compact agent evidence summaries, scoring, remediation planning, dependency resolution, foundation auditing/planning, public-contract verification, or agent capability validation.

inputs:
  operation:
    description: "Operation to run: run, environment-fingerprint, environment-verify, conformance, findings, agent-summary, score, remediation-plan, dependency-resolution, foundation, bootstrap-plan, public-contract, or agent-capabilities-validate."
    required: false
    default: run
  tier:
    description: Validation tier from .coding-tooling.json or the built-in defaults.
    required: false
    default: self
  component:
    description: Optional component name or repository-relative path.
    required: false
    default: ""
  config:
    description: Repository-relative configuration path.
    required: false
    default: .coding-tooling.json
  environment-profile:
    description: Environment fingerprint profile used by environment-fingerprint and environment-verify.
    required: false
    default: default
  report-path:
    description: Repository-relative JSON report path for report-producing operations.
    required: false
    default: .artifacts/coding-tooling/report.json
  validation-report:
    description: Optional repository-relative coding-tooling run report to include as fresh verification evidence in a score.
    required: false
    default: ""
  strict:
    description: Fail when a selected coding-tooling capability is unavailable.
    required: false
    default: "true"
  bun-version:
    description: Fallback Bun version used to execute coding-tooling when a run operation has no environment-v1 Bun declaration. An environment-v1 repository's exact Bun pin is authoritative.
    required: false
    default: 1.4.0
  install-mode:
    description: Install dependencies from supported repository-owned lockfiles automatically, or skip installation. A declared environment-v1 setup is authoritative for run operations.
    required: false
    default: auto
  source-sha:
    description: Caller-established source revision. GitHub Actions pushes github.sha when this input is omitted.
    required: false
    default: ""

outputs:
  report-path:
    description: Path to the machine-readable report when the selected operation produces one.
    value: ${{ steps.run.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Detect consumer environment-v1
      id: consumer-environment
      shell: bash
      env:
        INPUT_OPERATION: ${{ inputs.operation }}
      run: |
        set -euo pipefail
        detected=false
        node_version_file=false
        bun_version=""
        if [[ "$INPUT_OPERATION" == "run" && -f .repository-environment.toml && -f scripts/codex-environment.sh ]]; then
          detected=true
          if [[ -f .node-version ]]; then
            node_version_file=true
          fi

          package_bun=""
          if [[ -f package.json ]]; then
            package_bun="$(python3 - <<'PY'
        import json
        import pathlib

        path = pathlib.Path("package.json")
        try:
            value = json.loads(path.read_text(encoding="utf-8")).get("packageManager", "")
        except (OSError, json.JSONDecodeError):
            value = ""
        if isinstance(value, str) and value.startswith("bun@"):
            print(value.split("@", 1)[1])
        PY
        )"
          fi

          version_file_bun=""
          if [[ -f .bun-version ]]; then
            version_file_bun="$(python3 - <<'PY'
        import pathlib

        print(pathlib.Path(".bun-version").read_text(encoding="utf-8").strip())
        PY
        )"
          fi

          if [[ -n "$package_bun" && -n "$version_file_bun" && "$package_bun" != "$version_file_bun" ]]; then
            echo "::error::Conflicting Bun pins: package.json declares $package_bun while .bun-version declares $version_file_bun"
            exit 2
          fi

          bun_version="${package_bun:-$version_file_bun}"
          if [[ -n "$bun_version" && ! "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Environment-v1 Bun declarations must use an exact x.y.z version, got $bun_version"
            exit 2
          fi
        fi
        {
          echo "detected=$detected"
          echo "node-version-file=$node_version_file"
          echo "bun-version=$bun_version"
        } >> "$GITHUB_OUTPUT"

    - name: Detect coding-tooling Bun
      id: tooling-bun
      shell: bash
      env:
        INPUT_BUN_VERSION: ${{ inputs.bun-version }}
        CONSUMER_BUN_VERSION: ${{ steps.consumer-environment.outputs.bun-version }}
      run: |
        set -euo pipefail
        effective_version="$INPUT_BUN_VERSION"
        authority="action-fallback"
        if [[ -n "$CONSUMER_BUN_VERSION" ]]; then
          effective_version="$CONSUMER_BUN_VERSION"
          authority="environment-v1"
        fi

        ready=false
        if command -v bun >/dev/null 2>&1 && [[ "$(bun --version)" == "$effective_version" ]]; then
          ready=true
        fi
        {
          echo "ready=$ready"
          echo "version=$effective_version"
          echo "authority=$authority"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Bun
      if: steps.tooling-bun.outputs.ready != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.tooling-bun.outputs.version }}

    - name: Resolve consumer environment-v1 cache
      id: consumer-environment-cache
      if: steps.consumer-environment.outputs.detected == 'true'
      continue-on-error: true
      shell: bash
      env:
        INPUT_ENVIRONMENT_PROFILE: ${{ inputs.environment-profile }}
      run: |
        set -euo pipefail
        report="$(bun "${{ github.action_path }}/src/cli.ts" environment fingerprint --profile "$INPUT_ENVIRONMENT_PROFILE" --json)"
        fingerprint="$(printf '%s' "$report" | python3 -c 'import json,sys; value=json.load(sys.stdin).get("data",{}).get("fingerprint"); print(value or "")')"

        python3 - "$GITHUB_OUTPUT" "$fingerprint" <<'PY'
        import pathlib
        import sys
        import tomllib

        output = pathlib.Path(sys.argv[1])
        fingerprint = sys.argv[2]
        with open(".repository-environment.toml", "rb") as handle:
            config = tomllib.load(handle)

        paths = config.get("cache", {}).get("paths", [])
        if not fingerprint or not isinstance(paths, list):
            output.write_text("enabled=false\n", encoding="utf-8")
            raise SystemExit(0)

        normalized = []
        for value in paths:
            if isinstance(value, str) and value.strip():
                normalized.append(value.strip())

        if not normalized:
            output.write_text("enabled=false\n", encoding="utf-8")
            raise SystemExit(0)

        digest = fingerprint.rsplit(":", 1)[-1]
        with output.open("a", encoding="utf-8") as handle:
            handle.write("enabled=true\n")
            handle.write(f"fingerprint={digest}\n")
            handle.write("paths<<ENVIRONMENT_CACHE_PATHS\n")
            handle.write("\n".join(normalized))
            handle.write("\nENVIRONMENT_CACHE_PATHS\n")
        PY

    - name: Restore consumer environment-v1 cache
      if: steps.consumer-environment-cache.outputs.enabled == 'true'
      continue-on-error: true
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.consumer-environment-cache.outputs.paths }}
        key: ${{ runner.os }}-${{ runner.arch }}-environment-v1-${{ steps.consumer-environment-cache.outputs.fingerprint }}

    - name: Set up consumer Node
      if: steps.consumer-environment.outputs.node-version-file == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version

    - name: Prepare consumer environment-v1
      if: steps.consumer-environment.outputs.detected == 'true'
      shell: bash
      run: bash scripts/codex-environment.sh setup

    - name: Install consumer dependencies
      if: (inputs.operation == 'run' && steps.consumer-environment.outputs.detected != 'true') || inputs.operation == 'public-contract' || inputs.operation == 'score'
      shell: bash
      env:
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_INSTALL_MODE: ${{ inputs.install-mode }}
      run: |
        if [[ "$INPUT_INSTALL_MODE" == "none" ]]; then
          exit 0
        fi
        if [[ "$INPUT_INSTALL_MODE" != "auto" ]]; then
          echo "::error::install-mode must be 'auto' or 'none'"
          exit 2
        fi
        if [[ "$INPUT_OPERATION" == "run" ]]; then
          args=(install prepare --tier "$INPUT_TIER" --config "$INPUT_CONFIG" --json)
          if [[ -n "$INPUT_COMPONENT" ]]; then
            args+=(--component "$INPUT_COMPONENT")
          fi
          bun "${{ github.action_path }}/src/cli.ts" "${args[@]}"
          exit $?
        fi
        if [[ -f bun.lock || -f bun.lockb ]]; then
          bun install --frozen-lockfile
        elif [[ -f package-lock.json ]]; then
          npm ci
        elif [[ -f package.json ]]; then
          echo "::error::package.json exists without bun.lock, bun.lockb, or package-lock.json. Commit a supported lockfile or install dependencies explicitly and set install-mode: none."
          exit 2
        fi

    - name: Run coding-tooling
      id: run
      shell: bash
      env:
        INPUT_OPERATION: ${{ inputs.operation }}
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_COMPONENT: ${{ inputs.component }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ENVIRONMENT_PROFILE: ${{ inputs.environment-profile }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_VALIDATION_REPORT: ${{ inputs.validation-report }}
        INPUT_STRICT: ${{ inputs.strict }}
        CODING_TOOLING_SOURCE_SHA: ${{ inputs.source-sha != '' && inputs.source-sha || github.sha }}
        CODING_TOOLING_SOURCE_ROOT: ${{ github.workspace }}
      run: |
        if [[ "$INPUT_OPERATION" == "agent-capabilities-validate" ]]; then
          bun "${{ github.action_path }}/src/cli.ts" agent-capabilities validate .
          exit 0
        fi

        if [[ "$INPUT_OPERATION" == "public-contract" ]]; then
          mkdir -p "$(dirname "$INPUT_REPORT_PATH")"
          set +e
          bun "${{ github.action_path }}/src/entry.ts" contract verify \
            --config "$INPUT_CONFIG" --report "$INPUT_REPORT_PATH" --json
          status=$?
          set -e
          cat "$INPUT_REPORT_PATH"
          echo "report-path=$INPUT_REPORT_PATH" >> "$GITHUB_OUTPUT"
          exit "$status"
        fi

        if [[ "$INPUT_OPERATION" == "environment-fingerprint" || "$INPUT_OPERATION" == "environment-verify" || "$INPUT_OPERATION" == "conformance" || "$INPUT_OPERATION" == "findings" || "$INPUT_OPERATION" == "agent-summary" || "$INPUT_OPERATION" == "score" || "$INPUT_OPERATION" == "remediation-plan" || "$INPUT_OPERATION" == "dependency-resolution" || "$INPUT_OPERATION" == "foundation" || "$INPUT_OPERATION" == "bootstrap-plan" ]]; then
          mkdir -p "$(dirname "$INPUT_REPORT_PATH")"
          set +e
          if [[ "$INPUT_OPERATION" == "environment-fingerprint" ]]; then
            bun "${{ github.action_path }}/src/cli.ts" environment fingerprint \
              --profile "$INPUT_ENVIRONMENT_PROFILE" --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "environment-verify" ]]; then
            bun "${{ github.action_path }}/src/cli.ts" environment verify \
              --profile "$INPUT_ENVIRONMENT_PROFILE" --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "conformance" ]]; then
            bun "${{ github.action_path }}/src/cli.ts" conformance \
              --config "$INPUT_CONFIG" --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "findings" ]]; then
            bun "${{ github.action_path }}/src/entry.ts" findings --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "agent-summary" ]]; then
            bun "${{ github.action_path }}/src/router.ts" agent summary --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "remediation-plan" ]]; then
            bun "${{ github.action_path }}/src/entry.ts" remediation plan --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "dependency-resolution" ]]; then
            dependency_args=(dependencies resolve --json)
            if [[ "$INPUT_STRICT" == "true" ]]; then
              dependency_args+=(--strict)
            fi
            bun "${{ github.action_path }}/src/cli.ts" "${dependency_args[@]}" > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "foundation" ]]; then
            bun "${{ github.action_path }}/src/entry.ts" foundation audit --root . --json > "$INPUT_REPORT_PATH"
          elif [[ "$INPUT_OPERATION" == "bootstrap-plan" ]]; then
            bun "${{ github.action_path }}/src/cli.ts" bootstrap plan --root . --json > "$INPUT_REPORT_PATH"
          else
            score_args=(score --json)
            if [[ -n "$INPUT_VALIDATION_REPORT" && -f "$INPUT_VALIDATION_REPORT" ]]; then
              score_args+=(--validation-report "$INPUT_VALIDATION_REPORT")
            elif [[ -n "$INPUT_VALIDATION_REPORT" ]]; then
              echo "::notice::Validation report $INPUT_VALIDATION_REPORT was not produced; scoring structural evidence without fresh verification evidence."
            fi
            bun "${{ github.action_path }}/src/entry.ts" "${score_args[@]}" > "$INPUT_REPORT_PATH"
          fi
          status=$?
          set -e
          cat "$INPUT_REPORT_PATH"
          echo "report-path=$INPUT_REPORT_PATH" >> "$GITHUB_OUTPUT"
          exit "$status"
        fi

        if [[ "$INPUT_OPERATION" != "run" ]]; then
          echo "::error::operation must be 'run', 'environment-fingerprint', 'environment-verify', 'conformance', 'findings', 'agent-summary', 'score', 'remediation-plan', 'dependency-resolution', 'foundation', 'bootstrap-plan', 'public-contract', or 'agent-capabilities-validate'"
          exit 2
        fi

        args=(run --tier "$INPUT_TIER" --config "$INPUT_CONFIG" --report "$INPUT_REPORT_PATH" --json)
        if [[ -n "$INPUT_COMPONENT" ]]; then
          args+=(--component "$INPUT_COMPONENT")
        fi
        if [[ "$INPUT_STRICT" == "true" ]]; then
          args+=(--strict)
        fi
        bun "${{ github.action_path }}/src/cli.ts" "${args[@]}"
        echo "report-path=$INPUT_REPORT_PATH" >> "$GITHUB_OUTPUT"

    - name: Diagnose environment-v1 after run failure
      if: ${{ failure() && inputs.operation == 'run' && steps.consumer-environment.outputs.detected == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        INPUT_ENVIRONMENT_PROFILE: ${{ inputs.environment-profile }}
        DIAGNOSTIC_REPORT_PATH: .artifacts/coding-tooling/environment-failure-diagnostic.json
      run: |
        set +e
        tracked_state=clean
        git diff --quiet || tracked_state=changed
        git diff --cached --quiet || tracked_state=changed

        mkdir -p "$(dirname "$DIAGNOSTIC_REPORT_PATH")"
        bun "${{ github.action_path }}/src/cli.ts" environment verify \
          --profile "$INPUT_ENVIRONMENT_PROFILE" --json > "$DIAGNOSTIC_REPORT_PATH"
        verify_status=$?

        if [[ -f "$DIAGNOSTIC_REPORT_PATH" ]]; then
          cat "$DIAGNOSTIC_REPORT_PATH"
        fi
        echo "::notice::Failure-only environment diagnostics: tracked_state=$tracked_state, environment_verify_exit=$verify_status"
        exit 0
