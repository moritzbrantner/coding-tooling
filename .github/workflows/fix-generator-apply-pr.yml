name: Fix generator apply PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/generator-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: |
          sed -i 's/touched\.toReversed()/[...touched].reverse()/' src/generator-apply.ts
          bun run format:write
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generator-apply.ts
          git commit -m "Use compatible rollback iteration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
