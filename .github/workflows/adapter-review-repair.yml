name: Adapter review repair

on:
  push:
    branches: [fix/foundation-convention-adapter-evidence]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: fix/foundation-convention-adapter-evidence
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Apply review repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("src/foundation-audit.ts")
          source = source_path.read_text()
          source = source.replace('type ConventionAdapterStatus = "applied" | "unresolved";\n', '')
          source = re.sub(
              r'type ConventionAdapterBinding = \{.*?\n\};\n\n',
              '',
              source,
              count=1,
              flags=re.S,
          )
          replacement = '''function conventionAdapterEvidence(\n  root: string,\n  config: ToolingConfig | undefined,\n): { activeRules: Set<string>; diagnostics: Diagnostic[] } {\n  const configurations = loadInstalledConventionConfigurations(root);\n  if (configurations.length === 0) {\n    return { activeRules: new Set(), diagnostics: [] };\n  }\n\n  const configured = configuredConventionComponents(root, config);\n  let applied: Component[];\n  try {\n    applied = applyConventionConfigurations(root, configured);\n  } catch (error) {\n    return {\n      activeRules: new Set(),\n      diagnostics: [\n        {\n          code: "foundation-convention-adapter-invalid",\n          message: error instanceof Error ? error.message : String(error),\n        },\n      ],\n    };\n  }\n\n  const activeRules = new Set<string>();\n  const diagnostics: Diagnostic[] = [];\n  for (const configuration of configurations) {\n    for (let index = 0; index < configured.length; index += 1) {\n      const source = configured[index]!;\n      if (\n        source.kind !== "package" ||\n        (configuration.module !== "tooling" && !source.technologies.includes(configuration.module))\n      ) {\n        continue;\n      }\n      const original = source.capabilities[configuration.capability];\n      if (!original) {\n        diagnostics.push({\n          code: "foundation-convention-adapter-unresolved",\n          message: `${configuration.rule} installs ${configuration.tool} configuration for ${configuration.capability}, but ${source.name} has no selected ${configuration.capability} command`,\n          path: source.path,\n        });\n        continue;\n      }\n      const effective = applied[index]?.capabilities[configuration.capability];\n      if (commandsEqual(original, effective)) {\n        diagnostics.push({\n          code: "foundation-convention-adapter-unresolved",\n          message: `${configuration.rule} installs ${configuration.tool} configuration for ${configuration.capability}, but ${source.name} selects a command that the ${configuration.tool} adapter cannot compose`,\n          path: source.path,\n        });\n        continue;\n      }\n      if (configuration.tool === "oxlint") activeRules.add(configuration.rule);\n    }\n  }\n\n  return { activeRules, diagnostics };\n}\n'''
          source, count = re.subn(
              r'function conventionAdapterBindings\(.*?\n\}\n\n(?=function environmentAudit)',
              replacement + '\n',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("could not replace conventionAdapterBindings")
          source = source.replace(
              '  adapterBindings: ConventionAdapterBinding[];\n',
              '',
          )
          source = source.replace(
              '  const adapterEvidence = conventionAdapterBindings(root, config);',
              '  const adapterEvidence = conventionAdapterEvidence(root, config);',
          )
          source = source.replace(
              '      adapterBindings: adapterEvidence.bindings,\n',
              '',
          )
          source = source.replace(
              '    adapterBindings: adapterEvidence.bindings,\n',
              '',
          )
          source_path.write_text(source)

          test_path = Path("tests/foundation-convention-tooling.test.ts")
          test = test_path.read_text()
          test = test.replace(
              '  lintScript = "bunx oxlint@1.81.0 .",\n): string {',
              '  lintScript: string | null = "bunx oxlint@1.81.0 .",\n  configureLint = true,\n): string {',
          )
          test = test.replace(
              '    scripts: {\n      lint: lintScript,\n    },',
              '    scripts: lintScript ? { lint: lintScript } : {},',
          )
          test = test.replace('  installTooling(root);', '  installTooling(root, configureLint);')
          test, count = re.subn(
              r'function installTooling\(root: string\): void \{.*?\n\}',
              '''function installTooling(root: string, configureLint: boolean): void {\n  writeJson(join(root, ".coding-tooling.json"), {\n    schemaVersion: 1,\n    profile: "repository-foundation-v1",\n    requiredCapabilities: configureLint ? ["lint"] : [],\n    ...(configureLint\n      ? {\n          capabilityCommands: {\n            ".": {\n              lint: ["bun", "run", "lint"],\n            },\n          },\n        }\n      : {}),\n  });\n}''',
              test,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("could not replace installTooling")
          test = re.sub(
              r'  adapterBindings: Array<\{.*?\n  \}>;\n',
              '',
              test,
              count=1,
              flags=re.S,
          )
          test = re.sub(
              r'    expect\(tooling\.adapterBindings\)\.toEqual\(\[.*?\n    \]\);\n',
              '',
              test,
              count=1,
              flags=re.S,
          )
          insertion = '''\n\n  test("fails closed when an applicable convention has no selected capability command", () => {\n    const result = foundationAudit(repository(undefined, null, false));\n    const tooling = executableTooling(result);\n\n    expect(result.status).toBe("failed");\n    expect(tooling.status).toBe("invalid");\n    expect(tooling.requiredExecutables).toEqual([]);\n    expect(\n      result.diagnostics.filter(\n        (item) => item.code === "foundation-convention-adapter-unresolved",\n      ),\n    ).toHaveLength(2);\n    expect(\n      result.diagnostics.filter((item) => item.code === "foundation-required-capability-unresolved"),\n    ).toHaveLength(0);\n  });\n'''
          marker = '\n});\n'
          if not test.endswith(marker):
              raise SystemExit("unexpected test file ending")
          test = test[:-len(marker)] + insertion + marker
          test_path.write_text(test)
          PY
          bun x oxfmt src/foundation-audit.ts tests/foundation-convention-tooling.test.ts
          bun test tests/foundation-convention-tooling.test.ts --timeout 15000
          bun run typecheck
          rm .github/workflows/adapter-review-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/foundation-audit.ts tests/foundation-convention-tooling.test.ts .github/workflows/adapter-review-repair.yml
          git commit -m "fix: fail closed on missing convention capability"
          git push origin HEAD:fix/foundation-convention-adapter-evidence
