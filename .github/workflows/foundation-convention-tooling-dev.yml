name: Foundation convention tooling development

on:
  push:
    branches:
      - fix/foundation-convention-tooling

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Implement convention tooling audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/foundation-audit.ts')
          source = source_path.read_text()
          source = source.replace(
              'import { readJson, repositoryRoot } from "./shared.ts";',
              'import { readJson, repositoryRoot, walkFiles } from "./shared.ts";',
          )
          source = source.replace(
              '''type PackageManifest = {\n  packageManager?: unknown;\n  renovate?: unknown;\n};''',
              '''type PackageManifest = {\n  packageManager?: unknown;\n  renovate?: unknown;\n  dependencies?: unknown;\n  devDependencies?: unknown;\n};''',
          )
          marker = '''function environmentAudit(root: string): FoundationComponent {'''
          helpers = r'''type ConventionToolRequirement = {
            package: "oxfmt" | "oxlint" | "oxlint-tsgolint";
            reasons: string[];
          };

          function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          function addConventionToolRequirement(
            requirements: Map<ConventionToolRequirement["package"], Set<string>>,
            packageName: ConventionToolRequirement["package"],
            reason: string,
          ): void {
            const reasons = requirements.get(packageName) ?? new Set<string>();
            reasons.add(reason);
            requirements.set(packageName, reasons);
          }

          function conventionToolRequirements(root: string): ConventionToolRequirement[] {
            const installRoot = join(root, ".conventions");
            if (!existsSync(installRoot)) return [];
            const requirements = new Map<ConventionToolRequirement["package"], Set<string>>();
            for (const file of walkFiles(installRoot, 20).filter((path) => path.endsWith(".json")).sort()) {
              const value = readJson<unknown>(file);
              if (!isRecord(value)) continue;

              const configurations = value.configurations;
              if (Array.isArray(configurations)) {
                for (const entry of configurations) {
                  if (!isRecord(entry)) continue;
                  const rule = typeof entry.rule === "string" ? entry.rule : "installed configuration";
                  if (entry.tool === "oxlint") addConventionToolRequirement(requirements, "oxlint", rule);
                  if (entry.tool === "oxfmt") addConventionToolRequirement(requirements, "oxfmt", rule);
                }
              }

              const enforcement = value.enforcement;
              if (!isRecord(enforcement) || enforcement.kind !== "oxlint") continue;
              const rule = typeof value.ruleId === "string" ? value.ruleId : "installed Oxlint rule";
              addConventionToolRequirement(requirements, "oxlint", rule);
              const config = enforcement.config;
              const options = isRecord(config) ? config.options : undefined;
              if (isRecord(options) && options.typeAware === true) {
                addConventionToolRequirement(requirements, "oxlint-tsgolint", rule);
              }
            }
            return [...requirements.entries()]
              .map(([packageName, reasons]) => ({ package: packageName, reasons: [...reasons].sort() }))
              .sort((left, right) => left.package.localeCompare(right.package));
          }

          function declaredPackageVersions(root: string): Record<string, string> {
            const manifest = readJson<PackageManifest>(join(root, "package.json"));
            if (!manifest) return {};
            const result: Record<string, string> = {};
            for (const dependencyGroup of [manifest.dependencies, manifest.devDependencies]) {
              if (!isRecord(dependencyGroup)) continue;
              for (const [name, version] of Object.entries(dependencyGroup)) {
                if (typeof version === "string") result[name] = version;
              }
            }
            return result;
          }

          '''
          helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.splitlines())
          if helpers not in source:
              source = source.replace(marker, helpers + marker)

          old = '''  const check = conventionRegistryCommand("check", [], { root });\n  return component(check.status === "passed" ? "adopted" : "invalid", check.diagnostics, {\n    manifestPresent,\n    lockPresent,\n    snapshotPresent,\n    requestedModules: check.data.requestedModules ?? [],\n    resolvedModules: check.data.resolvedModules ?? [],\n    sourceRevision: check.data.sourceRevision,\n    drift: check.data.drift ?? [],\n  });'''
          new = '''  const check = conventionRegistryCommand("check", [], { root });\n  if (check.status !== "passed") {\n    return component("invalid", check.diagnostics, {\n      manifestPresent,\n      lockPresent,\n      snapshotPresent,\n      requestedModules: check.data.requestedModules ?? [],\n      resolvedModules: check.data.resolvedModules ?? [],\n      sourceRevision: check.data.sourceRevision,\n      drift: check.data.drift ?? [],\n    });\n  }\n\n  const requiredTools = conventionToolRequirements(root);\n  const declaredVersions = declaredPackageVersions(root);\n  const missingTools = requiredTools\n    .filter((requirement) => declaredVersions[requirement.package] === undefined)\n    .map((requirement) => requirement.package);\n  const floatingTools = requiredTools\n    .filter((requirement) => {\n      const version = declaredVersions[requirement.package];\n      return version !== undefined && !exactVersion(version);\n    })\n    .map((requirement) => ({ package: requirement.package, version: declaredVersions[requirement.package]! }));\n  const diagnostics: Diagnostic[] = [\n    ...missingTools.map((packageName) => ({\n      code: "foundation-convention-tool-missing",\n      message: `${packageName} is required by installed convention enforcement but is not declared as a repository dependency`,\n      path: "package.json",\n    })),\n    ...floatingTools.map((entry) => ({\n      code: "foundation-convention-tool-pin-floating",\n      message: `${entry.package} must use an exact x.y.z repository dependency pin, got ${entry.version}`,\n      path: "package.json",\n    })),\n  ];\n  const status: FoundationComponentStatus =\n    floatingTools.length > 0 ? "invalid" : missingTools.length > 0 ? "missing" : "adopted";\n  return component(status, diagnostics, {\n    manifestPresent,\n    lockPresent,\n    snapshotPresent,\n    requestedModules: check.data.requestedModules ?? [],\n    resolvedModules: check.data.resolvedModules ?? [],\n    sourceRevision: check.data.sourceRevision,\n    drift: check.data.drift ?? [],\n    requiredTools,\n    missingTools,\n    floatingTools,\n  });'''
          if old not in source:
              raise SystemExit('conventionsAudit replacement anchor not found')
          source = source.replace(old, new)
          source_path.write_text(source)

          test_path = Path('tests/foundation-audit.test.ts')
          tests = test_path.read_text()
          helper_anchor = '''function installRenovate(root: string): void {'''
          helper = r'''function installTypeAwareConvention(root: string): void {
            const relative = "modules/typescript/technologies/typescript/TS-005.json";
            const absolute = join(root, ".conventions", relative);
            mkdirSync(join(absolute, ".."), { recursive: true });
            const content = `${JSON.stringify(
              {
                schemaVersion: 1,
                ruleId: "TS-005",
                enforcement: {
                  kind: "oxlint",
                  technologies: ["typescript"],
                  config: { options: { typeAware: true }, rules: {} },
                },
              },
              null,
              2,
            )}\n`;
            writeFileSync(absolute, content);
            const lockPath = join(root, "conventions.lock.json");
            const lock = JSON.parse(readFileSync(lockPath, "utf8")) as {
              files: Record<string, string>;
            };
            lock.files[relative] = hash(content);
            writeJson(lockPath, lock);
          }

          function declareTooling(root: string, versions: Record<string, string>): void {
            const path = join(root, "package.json");
            const manifest = JSON.parse(readFileSync(path, "utf8")) as Record<string, unknown>;
            manifest.devDependencies = versions;
            writeJson(path, manifest);
          }

          '''
          helper = '\n'.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines())
          if helper not in tests:
              tests = tests.replace(helper_anchor, helper + helper_anchor)
          tests = tests.replace(
              'import { mkdirSync, mkdtempSync, writeFileSync } from "node:fs";',
              'import { mkdirSync, mkdtempSync, readFileSync, writeFileSync } from "node:fs";',
          )
          insert_before = '''  test("fails deterministic structural drift without depending on installed runtimes", () => {'''
          cases = r'''  test("reports convention executables missing from repository dependency state", () => {
            const root = repository();
            installEnvironment(root);
            installTooling(root);
            installConventions(root);
            installTypeAwareConvention(root);
            installRenovate(root);

            const result = foundationAudit(root);

            expect(result.status).toBe("failed");
            expect(statuses(result).conventions).toBe("missing");
            expect(result.diagnostics.map((diagnostic) => diagnostic.code)).toContain(
              "foundation-convention-tool-missing",
            );
            const conventions = (result.data.components as Record<string, Record<string, unknown>>)
              .conventions;
            expect(conventions.missingTools).toEqual(["oxlint", "oxlint-tsgolint"]);
          });

          test("accepts exact pinned tooling required by installed conventions", () => {
            const root = repository();
            installEnvironment(root);
            installTooling(root);
            installConventions(root);
            installTypeAwareConvention(root);
            installRenovate(root);
            declareTooling(root, { oxlint: "1.81.0", "oxlint-tsgolint": "7.0.2001" });

            const result = foundationAudit(root);

            expect(result.status).toBe("passed");
            expect(statuses(result).conventions).toBe("adopted");
          });

          test("rejects floating convention tooling pins", () => {
            const root = repository();
            installEnvironment(root);
            installTooling(root);
            installConventions(root);
            installTypeAwareConvention(root);
            installRenovate(root);
            declareTooling(root, { oxlint: "^1.81.0", "oxlint-tsgolint": "7.0.2001" });

            const result = foundationAudit(root);

            expect(result.status).toBe("failed");
            expect(statuses(result).conventions).toBe("invalid");
            expect(result.diagnostics.map((diagnostic) => diagnostic.code)).toContain(
              "foundation-convention-tool-pin-floating",
            );
          });

          '''
          cases = '\n'.join(line[10:] if line.startswith('          ') else line for line in cases.splitlines())
          if cases not in tests:
              tests = tests.replace(insert_before, cases + insert_before)
          test_path.write_text(tests)
          PY
          bun run format:write
          bun run lint
          bun run typecheck
          bun test tests/foundation-audit.test.ts
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/foundation-audit.ts tests/foundation-audit.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: audit convention executable prerequisites"
          git push origin HEAD
