name: Apply convergence review fixes

on:
  push:
    branches:
      - feat/stronger-repository-convergence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/stronger-repository-convergence
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Mirror topology and env review fixes into Pages preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("site/preflight.js")
          content = path.read_text()
          start = content.index("const PAGES_DEPLOYMENT_PATTERN =")
          end = content.index("function findingsFor(snapshot, paths, components, validationEvidence) {")
          helper = r'''const PAGES_DEPLOYMENT_PATTERN =
            /(?:actions\/upload-pages-artifact|actions\/deploy-pages|deploy-pages\.ya?ml|pages:\s*write)/i;
          const ARTIFACT_PRODUCER_PATTERN =
            /(?:actions\/upload-pages-artifact|build-artifact\.ya?ml|artifact_paths\s*:)/i;
          const EXACT_ARTIFACT_CONSUMER_PATTERN =
            /(?:prebuilt_artifact_(?:run_id|name|digest|source_sha|key|identity_digest|destination)|actions\/download-artifact)/i;
          const DEPLOYMENT_JOB_PATTERN = /(?:actions\/deploy-pages|deploy-pages\.ya?ml)/i;
          const RUNTIME_VERIFICATION_PATTERN =
            /(?:playwright|e2e_command|test:e2e|browser(?:[-:_ ]?smoke)?|vite\s+preview|next\s+start)/i;
          const BUILD_INVOCATION_PATTERN =
            /(?:\b(?:vite|next|nuxt|astro|vitepress|react-scripts|webpack)\b[^\n]*\bbuild\b|\b(?:bun|npm|pnpm|yarn)\s+(?:run\s+)?build(?::[A-Za-z0-9:_-]+)?\b)/i;
          const PRODUCTION_ENVIRONMENT_PATTERN =
            /\b((?:VITE|NEXT_PUBLIC|NUXT_PUBLIC|PUBLIC|REACT_APP)_[A-Z0-9_]+)\s*=\s*(?:"[^"]*"|'[^']*'|[^\s\\]+)/g;
          const PUBLIC_ENVIRONMENT_KEY_PATTERN =
            /\b((?:VITE|NEXT_PUBLIC|NUXT_PUBLIC|PUBLIC|REACT_APP)_[A-Z0-9_]+)\s*:/g;
          const BASE_PATH_PATTERN = /(?:^|\s)--base(?:\s+|=)(?:"[^"]+"|'[^']+'|[^\s\\]+)/g;

          function indentation(line) {
            return line.match(/^\s*/)[0].length;
          }

          function parseNeeds(source) {
            const lines = source.split(/\r?\n/);
            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              const match = line.match(/^(\s*)needs:\s*(.*)$/);
              if (!match) continue;
              const indent = match[1].length;
              const inline = match[2].trim();
              if (inline) {
                return new Set(
                  inline
                    .replace(/^\[/, "")
                    .replace(/\]$/, "")
                    .split(",")
                    .map((value) => value.trim().replace(/^['"]|['"]$/g, ""))
                    .filter(Boolean),
                );
              }
              const needs = new Set();
              for (index += 1; index < lines.length; index += 1) {
                const next = lines[index];
                if (!next.trim()) continue;
                if (indentation(next) <= indent) break;
                const item = next.trim().match(/^-\s+['"]?([A-Za-z0-9_.-]+)['"]?\s*$/);
                if (item?.[1]) needs.add(item[1]);
              }
              return needs;
            }
            return new Set();
          }

          function workflowJobs(content) {
            const lines = content.split(/\r?\n/);
            const jobsLine = lines.findIndex((line) => /^\s*jobs:\s*(?:#.*)?$/.test(line));
            if (jobsLine < 0) return [];
            const jobsIndent = indentation(lines[jobsLine]);
            let sectionEnd = lines.length;
            for (let index = jobsLine + 1; index < lines.length; index += 1) {
              const line = lines[index];
              if (!line.trim()) continue;
              if (indentation(line) <= jobsIndent) {
                sectionEnd = index;
                break;
              }
            }
            const candidates = [];
            for (let index = jobsLine + 1; index < sectionEnd; index += 1) {
              const line = lines[index];
              const match = line.match(/^(\s*)([A-Za-z0-9_.-]+):\s*(?:#.*)?$/);
              if (!match || match[1].length <= jobsIndent) continue;
              candidates.push({ index, indent: match[1].length, key: match[2] });
            }
            const jobIndent = candidates.reduce(
              (minimum, candidate) => Math.min(minimum, candidate.indent),
              Number.POSITIVE_INFINITY,
            );
            if (!Number.isFinite(jobIndent)) return [];
            const starts = candidates.filter((candidate) => candidate.indent === jobIndent);
            return starts.map((start, position) => {
              const end = starts[position + 1]?.index ?? sectionEnd;
              const source = lines.slice(start.index, end).join("\n");
              return { key: start.key, source, indent: start.indent, needs: parseNeeds(source) };
            });
          }

          function commandBlocks(content) {
            const lines = content.split(/\r?\n/);
            const blocks = [];
            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              const match = line.match(/^(\s*)(-\s+)?(?:run|build_command):\s*(.*)$/);
              if (!match) continue;
              const indent = match[1].length;
              const effectiveIndent = indent + (match[2] ? 2 : 0);
              const inline = match[3].trim();
              const lineIndex = index;
              if (inline && inline !== "|" && inline !== ">") {
                blocks.push({ command: inline, lineIndex, effectiveIndent });
                continue;
              }
              const block = [];
              for (index += 1; index < lines.length; index += 1) {
                const next = lines[index];
                if (!next.trim()) {
                  block.push("");
                  continue;
                }
                if (indentation(next) <= indent) {
                  index -= 1;
                  break;
                }
                block.push(next.trim());
              }
              blocks.push({ command: block.join("\n"), lineIndex, effectiveIndent });
            }
            return blocks;
          }

          function environmentKeysFromMap(lines, envIndex) {
            const line = lines[envIndex];
            const match = line.match(/^(\s*)(?:-\s+)?env:\s*(.*)$/);
            if (!match) return [];
            const envIndent = match[1].length;
            const inline = match[2].trim();
            if (inline.startsWith("{") && inline.endsWith("}")) {
              return [...inline.matchAll(PUBLIC_ENVIRONMENT_KEY_PATTERN)]
                .map((entry) => entry[1])
                .filter(Boolean);
            }
            const keys = [];
            for (let index = envIndex + 1; index < lines.length; index += 1) {
              const next = lines[index];
              if (!next.trim()) continue;
              if (indentation(next) <= envIndent) break;
              for (const key of next.matchAll(PUBLIC_ENVIRONMENT_KEY_PATTERN)) {
                if (key[1]) keys.push(key[1]);
              }
            }
            return keys;
          }

          function directEnvironmentKeys(source, parentIndent) {
            const lines = source.split(/\r?\n/);
            const childIndents = lines
              .slice(1)
              .filter((line) => line.trim() && indentation(line) > parentIndent)
              .map(indentation);
            if (childIndents.length === 0) return [];
            const directIndent = Math.min(...childIndents);
            const keys = new Set();
            for (let index = 1; index < lines.length; index += 1) {
              const line = lines[index];
              if (indentation(line) !== directIndent || !/^\s*env:/.test(line)) continue;
              for (const key of environmentKeysFromMap(lines, index)) keys.add(key);
            }
            return [...keys].toSorted();
          }

          function topLevelEnvironmentKeys(content) {
            const lines = content.split(/\r?\n/);
            const keys = new Set();
            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              if (indentation(line) !== 0 || !/^env:/.test(line)) continue;
              for (const key of environmentKeysFromMap(lines, index)) keys.add(key);
            }
            return [...keys].toSorted();
          }

          function stepEnvironmentKeys(source, command) {
            const lines = source.split(/\r?\n/);
            let stepStart = -1;
            let stepIndent = -1;
            for (let index = command.lineIndex; index >= 0; index -= 1) {
              const line = lines[index];
              const match = line.match(/^(\s*)-\s+/);
              if (!match || match[1].length >= command.effectiveIndent) continue;
              stepStart = index;
              stepIndent = match[1].length;
              break;
            }
            if (stepStart < 0) return [];
            let stepEnd = lines.length;
            for (let index = stepStart + 1; index < lines.length; index += 1) {
              const line = lines[index];
              if (!line.trim()) continue;
              if (indentation(line) <= stepIndent) {
                stepEnd = index;
                break;
              }
            }
            if (command.lineIndex >= stepEnd) return [];
            const keys = new Set();
            for (let index = stepStart; index < stepEnd; index += 1) {
              const line = lines[index];
              const match = line.match(/^(\s*)env:/);
              if (!match || match[1].length !== command.effectiveIndent) continue;
              for (const key of environmentKeysFromMap(lines, index)) keys.add(key);
            }
            return [...keys].toSorted();
          }

          function runtimeSensitiveBuildSignals(job, workflowEnvironmentKeys) {
            const signals = new Set();
            const jobEnvironmentKeys = directEnvironmentKeys(job.source, job.indent);
            for (const command of commandBlocks(job.source)) {
              if (!BUILD_INVOCATION_PATTERN.test(command.command)) continue;
              for (const match of command.command.matchAll(PRODUCTION_ENVIRONMENT_PATTERN)) {
                if (match[1]) signals.add(`production environment ${match[1]}`);
              }
              for (const match of command.command.matchAll(BASE_PATH_PATTERN)) {
                signals.add(`production ${match[0].trim()}`);
              }
              for (const key of workflowEnvironmentKeys) signals.add(`production environment ${key}`);
              for (const key of jobEnvironmentKeys) signals.add(`production environment ${key}`);
              for (const key of stepEnvironmentKeys(job.source, command)) {
                signals.add(`production environment ${key}`);
              }
            }
            return [...signals].toSorted();
          }

          function runtimeSensitiveProducers(content) {
            const workflowEnvironmentKeys = topLevelEnvironmentKeys(content);
            return workflowJobs(content).flatMap((job) => {
              if (!ARTIFACT_PRODUCER_PATTERN.test(job.source)) return [];
              const signals = runtimeSensitiveBuildSignals(job, workflowEnvironmentKeys);
              return signals.length > 0 ? [{ job, signals }] : [];
            });
          }

          function escaped(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }

          function referencesProducerOutputs(source, producerKey) {
            return new RegExp(`\\bneeds\\.${escaped(producerKey)}\\.outputs\\.`).test(source);
          }

          function consumesProducerArtifact(job, producerKey) {
            return (
              job.needs.has(producerKey) &&
              EXACT_ARTIFACT_CONSUMER_PATTERN.test(job.source) &&
              referencesProducerOutputs(job.source, producerKey)
            );
          }

          function hasExactArtifactRuntimeVerification(content) {
            const jobs = workflowJobs(content);
            const producers = runtimeSensitiveProducers(content);
            return producers.some(({ job: producer }) => {
              const verifiers = jobs.filter(
                (job) =>
                  job.key !== producer.key &&
                  RUNTIME_VERIFICATION_PATTERN.test(job.source) &&
                  consumesProducerArtifact(job, producer.key),
              );
              return verifiers.some((verifier) =>
                jobs.some(
                  (deploy) =>
                    deploy.key !== producer.key &&
                    deploy.key !== verifier.key &&
                    DEPLOYMENT_JOB_PATTERN.test(deploy.source) &&
                    deploy.needs.has(verifier.key) &&
                    consumesProducerArtifact(deploy, producer.key),
                ),
              );
            });
          }

          function deploymentRuntimeParityGaps(snapshot) {
            return Object.entries(snapshot.files)
              .filter(([path]) => /^\.github\/workflows\/.+\.ya?ml$/i.test(path))
              .flatMap(([path, source]) => {
                if (typeof source !== "string" || !PAGES_DEPLOYMENT_PATTERN.test(source)) return [];
                const producers = runtimeSensitiveProducers(source);
                const signals = [...new Set(producers.flatMap((producer) => producer.signals))].toSorted();
                if (signals.length === 0 || hasExactArtifactRuntimeVerification(source)) return [];
                return [{ path, signals }];
              });
          }

          '''
          content = content[:start] + helper + content[end:]
          content = content.replace(
              '`${gap.path} contains ${gap.signals.join(", ")} without browser/runtime validation consuming the produced artifact.`,',
              '`${gap.path} contains ${gap.signals.join(", ")} without a proven producer → runtime-verifier → deploy chain for that artifact.`,',
              1,
          )
          path.write_text(content)

          tests = Path("tests/site-preflight.test.js")
          test_content = tests.read_text()
          test_content = test_content.replace(
              '''  deploy:\n    needs: [build, verify]\n    uses: owner/reusable/.github/workflows/deploy-pages.yml@0123456789012345678901234567890123456789\n''',
              '''  deploy:\n    needs: [build, verify]\n    uses: owner/reusable/.github/workflows/deploy-pages.yml@0123456789012345678901234567890123456789\n    with:\n      prebuilt_artifact_run_id: needs.build.outputs.producer_run_id\n      prebuilt_artifact_digest: needs.build.outputs.artifact_digest\n''',
              1,
          )
          marker = '  test("ignores remote public runtime variables outside build commands", () => {\n'
          additions = r'''
            test("does not correlate remote artifact consumption and runtime testing across unrelated jobs", () => {
              const analysis = analyzeSnapshot(
                repository({
                  tree: [
                    blob("package.json", "1"),
                    blob(".coding-tooling.json", "2"),
                    blob("AGENTS.md", "3"),
                    blob("renovate.json", "4"),
                    blob(".github/workflows/pages.yml", "5"),
                  ],
                  files: {
                    "package.json": JSON.stringify({ name: "fixture", packageManager: "bun@1.4.0", scripts: { test: "test" } }),
                    ".coding-tooling.json": JSON.stringify({ schemaVersion: 1 }),
                    ".github/workflows/pages.yml": `name: Pages
          on:
            pull_request:
          permissions:
            pages: write
          jobs:
            build:
              uses: owner/reusable/.github/workflows/build-artifact.yml@0123456789012345678901234567890123456789
              with:
                build_command: VITE_HOSTED_RUNTIME=1 bunx vite build --base /fixture/
                artifact_paths: dist
            unrelated-download:
              needs: build
              steps:
                - uses: actions/download-artifact@0123456789012345678901234567890123456789
                  with:
                    run-id: needs.build.outputs.producer_run_id
            browser:
              needs: build
              steps:
                - run: bunx playwright test
            deploy:
              needs: [build, browser]
              uses: owner/reusable/.github/workflows/deploy-pages.yml@0123456789012345678901234567890123456789
              with:
                prebuilt_artifact_run_id: needs.build.outputs.producer_run_id
                prebuilt_artifact_digest: needs.build.outputs.artifact_digest
          `,
                  },
                }),
              );
              expect(analysis.findings.some((finding) => finding.id.startsWith("REMOTE-DEPLOY-"))).toBe(true);
            });

            test("recognizes remote Actions env maps on a runtime-sensitive build", () => {
              const analysis = analyzeSnapshot(
                repository({
                  tree: [
                    blob("package.json", "1"),
                    blob(".coding-tooling.json", "2"),
                    blob("AGENTS.md", "3"),
                    blob("renovate.json", "4"),
                    blob(".github/workflows/pages.yml", "5"),
                  ],
                  files: {
                    "package.json": JSON.stringify({ name: "fixture", packageManager: "bun@1.4.0", scripts: { test: "test" } }),
                    ".coding-tooling.json": JSON.stringify({ schemaVersion: 1 }),
                    ".github/workflows/pages.yml": `name: Pages
          on:
            pull_request:
          permissions:
            pages: write
          jobs:
            build:
              env:
                VITE_HOSTED_RUNTIME: "1"
              steps:
                - run: bunx vite build
                - uses: actions/upload-pages-artifact@0123456789012345678901234567890123456789
          `,
                  },
                }),
              );
              const finding = analysis.findings.find((entry) => entry.id.startsWith("REMOTE-DEPLOY-"));
              expect(finding?.evidence).toContain("production environment VITE_HOSTED_RUNTIME");
            });

          '''
          if "does not correlate remote artifact consumption" not in test_content:
              if marker not in test_content:
                  raise SystemExit("remote test insertion marker missing")
              test_content = test_content.replace(marker, additions + marker, 1)
          tests.write_text(test_content)
          PY
      - run: bunx oxfmt .
      - run: bun run typecheck
      - run: bun test tests/deployment-runtime-parity.test.ts tests/deployment-runtime-parity-integration.test.ts tests/open-pr-reconciliation.test.ts tests/site-preflight.test.js tests/expectation-registry-contract.test.ts tests/remote-snapshot-acquisition.test.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/preflight.js tests/site-preflight.test.js src/expectation-deployment-detector.ts tests/deployment-runtime-parity.test.ts src/open-pr-reconciliation.ts tests/open-pr-reconciliation.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Address convergence review findings'
          git push origin HEAD:feat/stronger-repository-convergence
