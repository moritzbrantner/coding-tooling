name: Change-aware Pages dogfood v2

on:
  push:
    branches: [feat/change-aware-dogfood-v2]
    paths:
      - ".github/workflows/change-aware-dogfood-v2.yml"

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Dogfood remote change-aware analysis
        shell: bash
        run: |
          cat > .dogfood-change-aware.mjs <<'EOF'
          import { remoteChangeCommand } from "./site/change-aware.js";

          const result = await remoteChangeCommand(
            "moritzbrantner/coding-tooling",
            "affected --base 43a18a0fd086319dce432c2a84835f229ea70e3f --head 444470d80c6c26fb8a015d01bde85da007064546 --tier self --json",
          );
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== "passed") process.exit(1);
          EOF
          bun .dogfood-change-aware.mjs
          rm .dogfood-change-aware.mjs
