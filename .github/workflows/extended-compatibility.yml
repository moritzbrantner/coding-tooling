name: Extended Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: extended-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: Cross-platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run the runtime test suite
        run: bun test --timeout 15000

  decision-atlas-pilot:
    name: Decision Atlas / pinned My Farm source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Check out the authoritative My Farm Atlas revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/my-farm
          ref: e66ab2b327334fe5ba9b0941cdfbcaf6be8627b3
          path: .artifacts/my-farm-decision-source
      - name: Validate and preview 25 source decisions without write-back
        run: |
          bun src/router.ts decision-atlas index \
            --root .artifacts/my-farm-decision-source \
            --repository moritzbrantner/my-farm \
            --source docs/decisions/atlas.md \
            --format numbered-list \
            --revision e66ab2b327334fe5ba9b0941cdfbcaf6be8627b3 \
            --min-decisions 25 \
            --output "$RUNNER_TEMP/decision-atlas-my-farm"
          test -s "$RUNNER_TEMP/decision-atlas-my-farm/index.json"
          test -s "$RUNNER_TEMP/decision-atlas-my-farm/preview.html"
      - name: Assert all accepted My Farm selections and historic aliases were retained
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          index = json.loads((Path(os.environ["RUNNER_TEMP"]) / "decision-atlas-my-farm/index.json").read_text())
          leaves = index["decisions"]
          assert len(leaves) == 25, f"expected 25 authoritative choices, got {len(leaves)}"
          assert all(x["kind"] == "decision" and x["decisionStatus"] == "accepted" and x["choice"] for x in leaves)
          aliases = [alias for entry in leaves for alias in entry["aliases"]]
          assert len(aliases) == 23 and len(set(aliases)) == 23, f"legacy aliases changed: {len(aliases)}"
          PY
      - name: Check out the open MMORPG PR's pinned authoring format
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/mmorpg
          ref: 404f17552fe677d64a8aa638a1f5afa5f3570a94
          path: .artifacts/mmorpg-decision-source
      - name: Validate MMORPG numbered IDs and unresolved Questions
        run: |
          bun src/router.ts decision-atlas index \
            --root .artifacts/mmorpg-decision-source \
            --repository moritzbrantner/mmorpg \
            --source docs/decisions/atlas.md \
            --format numbered-list \
            --revision 404f17552fe677d64a8aa638a1f5afa5f3570a94 \
            --min-decisions 100 \
            --output "$RUNNER_TEMP/decision-atlas-mmorpg"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          index = json.loads((Path(os.environ["RUNNER_TEMP"]) / "decision-atlas-mmorpg/index.json").read_text())
          assert any(x["kind"] == "question" and x["choice"] is None and x["decisionStatus"] is None for x in index["decisions"])
          assert all(x["implementation"]["verification"] == "unverified" for x in index["decisions"])
          PY
