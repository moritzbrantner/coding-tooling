name: Format change-aware Pages

on:
  push:
    branches: [feat/change-aware-pages]
    paths:
      - ".github/workflows/format-change-aware.yml"
      - "site/change-aware.js"
      - "site/affected.json/affected-json.js"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/change-aware-pages
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Format change-aware files
        run: bunx oxfmt site/change-aware.js site/affected.json/affected-json.js
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- site/change-aware.js site/affected.json/affected-json.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/change-aware.js site/affected.json/affected-json.js
          git commit -m "Format change-aware Pages files"
          git push origin HEAD:feat/change-aware-pages
