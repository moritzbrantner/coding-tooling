name: Source Deps Format Preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/javascript-source-deps
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply canonical format
        run: |
          bun run format:write
          if git diff --quiet -- docs/source-development-mode.md src/javascript-source-deps.ts src/source-deps.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/source-development-mode.md src/javascript-source-deps.ts src/source-deps.ts
          git commit -m "Format source dependency changes"
          git push origin HEAD:feat/javascript-source-deps
