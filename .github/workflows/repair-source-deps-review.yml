name: Repair Source Deps Review

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/javascript-source-deps
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Repair review findings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path("src/javascript-source-deps.ts")
          js = js_path.read_text()
          marker = '''function exactRevision(value: string): boolean {
            return /^[0-9a-f]{40}$/i.test(value);
          }
          '''
          replacement = marker + '''
          function safePackageIdentity(value: string): boolean {
            if (!value || value.includes("\\\\") || value.includes("\\0")) return false;
            const segments = value.split("/");
            if (value.startsWith("@")) {
              return (
                segments.length === 2 &&
                segments[0]!.length > 1 &&
                segments[1]!.length > 0 &&
                segments.every((segment) => segment !== "." && segment !== "..")
              );
            }
            return segments.length === 1 && segments[0] !== "." && segments[0] !== "..";
          }
          '''
          if "function safePackageIdentity" not in js:
            if marker not in js:
              raise SystemExit("exactRevision marker not found")
            js = js.replace(marker, replacement, 1)

          marker = '''      const packageName = requireString(
                packageRecord.package,
                `Every JavaScript source package requires package: ${configPath}`,
              );
              if (seenPackages.has(packageName)) {
          '''
          replacement = '''      const packageName = requireString(
                packageRecord.package,
                `Every JavaScript source package requires package: ${configPath}`,
              );
              if (!safePackageIdentity(packageName)) {
                throw new Error(`Invalid JavaScript package identity: ${packageName}`);
              }
              if (seenPackages.has(packageName)) {
          '''
          if "Invalid JavaScript package identity" not in js:
            if marker not in js:
              raise SystemExit("packageName marker not found")
            js = js.replace(marker, replacement, 1)

          marker = '''function targetDirectory(root: string, packageName: string): string {
            return join(root, "node_modules", ...packageName.split("/"));
          }
          '''
          replacement = '''function targetDirectory(root: string, packageName: string): string {
            const modulesRoot = resolve(root, "node_modules");
            const target = resolve(modulesRoot, ...packageName.split("/"));
            const relation = relative(modulesRoot, target);
            if (
              relation === "" ||
              relation === ".." ||
              relation.startsWith(`..${sep}`) ||
              isAbsolute(relation)
            ) {
              throw new Error(`JavaScript package target escapes node_modules: ${packageName}`);
            }
            return target;
          }
          '''
          if "JavaScript package target escapes node_modules" not in js:
            if marker not in js:
              raise SystemExit("targetDirectory marker not found")
            js = js.replace(marker, replacement, 1)
          js_path.write_text(js)

          fleet_path = Path("src/fleet-authority-graph.ts")
          fleet = fleet_path.read_text()
          pattern = re.compile(
            r'''  const entries: Array<Record<string, unknown>> = \[\];\n  const diagnostics: Diagnostic\[\] = \[\];\n  for \(const patch of loaded\.patches\) \{.*?\n  \}\n  entries\.sort''',
            re.S,
          )
          replacement = '''  const entries: Array<Record<string, unknown>> = [];
            const diagnostics: Diagnostic[] = [];
            const sources =
              loaded.schemaVersion <= 2
                ? loaded.patches.map((patch) => ({
                    ecosystem: "cargo" as const,
                    git: patch.git,
                    rev: patch.rev,
                    localPath: patch.localPath ?? null,
                    localOnly: loaded.localOnly,
                    packages: [{ package: patch.package }],
                  }))
                : loaded.sourceRepositories.map((repository) => ({
                    ecosystem: repository.ecosystem,
                    git: repository.git,
                    rev: repository.rev,
                    localPath: repository.localPath ?? null,
                    localOnly: repository.localOnly,
                    packages: repository.packages,
                  }));

            for (const source of sources) {
              const git = source.git;
              const rev = source.rev.toLowerCase();
              const localPath = source.localPath;
              const packageNames = source.packages.map((entry) => entry.package).filter(Boolean);
              const label = packageNames.join(", ") || git;
              if (!git || packageNames.length === 0 || !/^[0-9a-f]{40}$/i.test(rev)) {
                diagnostics.push({
                  code: "authority-graph-source-patch-invalid",
                  message: `Source ${label} lacks package, Git URL, or exact revision`,
                  path: ".coding-tooling.source-deps.json",
                });
                continue;
              }
              if (source.localOnly && !localPath) {
                diagnostics.push({
                  code: "authority-graph-local-source-required",
                  message: `${label} is local-only but does not declare localPath`,
                  path: ".coding-tooling.source-deps.json",
                });
              }
              let actualRevision: string | null = null;
              if (localPath) {
                const resolvedLocal = resolve(root, localPath);
                if (existsSync(resolvedLocal)) {
                  const command = runner("git", ["-C", resolvedLocal, "rev-parse", "HEAD"], root);
                  if (command.status === 0 && /^[0-9a-f]{40}$/i.test(command.stdout.trim())) {
                    actualRevision = command.stdout.trim().toLowerCase();
                    if (actualRevision !== rev) {
                      diagnostics.push({
                        code: "authority-graph-source-revision-drift",
                        message: `${label} local source is ${actualRevision}, expected ${rev}`,
                        path: ".coding-tooling.source-deps.json",
                      });
                    }
                  } else {
                    diagnostics.push({
                      code: "authority-graph-source-revision-unavailable",
                      message: `Could not resolve local source revision for ${label}`,
                      path: ".coding-tooling.source-deps.json",
                    });
                  }
                } else if (source.localOnly) {
                  diagnostics.push({
                    code: "authority-graph-local-source-missing",
                    message: `${label} local-only checkout does not exist at ${localPath}`,
                    path: ".coding-tooling.source-deps.json",
                  });
                }
              }
              for (const packageEntry of source.packages) {
                entries.push({
                  package: packageEntry.package,
                  ecosystem: source.ecosystem,
                  repository: githubRepository(git),
                  git,
                  declaredRevision: rev,
                  localOnly: source.localOnly,
                  localPath,
                  actualRevision,
                  exactRevisionSatisfied:
                    actualRevision === null ? (source.localOnly ? false : null) : actualRevision === rev,
                });
              }
            }
            entries.sort'''
          fleet, count = pattern.subn(replacement, fleet, count=1)
          if count != 1:
            if "const sources =" not in fleet:
              raise SystemExit("fleet source evidence block not found")
          fleet_path.write_text(fleet)
          PY
          bun run format:write
          bun run typecheck
          bun test tests/source-deps-v4.test.ts tests/fleet-authority-graph.test.ts tests/javascript-source-deps.test.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/javascript-source-deps.ts src/fleet-authority-graph.ts tests/source-deps-v4.test.ts tests/fleet-authority-graph.test.ts
          git commit -m "Fix JavaScript source dependency review findings"
          git push origin HEAD:feat/javascript-source-deps
