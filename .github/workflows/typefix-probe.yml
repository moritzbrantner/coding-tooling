name: Eligibility Type Fix

on:
  push:
    branches:
      - merge/trusted-pr-eligibility

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply exact type-boundary fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/pr-eligibility.ts": [
                  (
                      '      ...readiness.blockers.map((blocker) => blocker.code),\n',
                      '      ...readiness.blockers.map(\n        (blocker) => blocker.code ?? "repository-readiness-blocker",\n      ),\n',
                  ),
              ],
              "tests/pr-eligibility.test.ts": [
                  (
                      '  return output.diagnostics.map((diagnostic) => diagnostic.code);\n',
                      '  return output.diagnostics\n    .map((diagnostic) => diagnostic.code)\n    .filter((code): code is string => Boolean(code));\n',
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one match in {filename}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          bun run format:write
          git add src/pr-eligibility.ts tests/pr-eligibility.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix eligibility type boundaries"
          git push origin HEAD:merge/trusted-pr-eligibility
