name: Repair legacy work markers once

on:
  push:
    branches: [repair/convention-snapshot]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: repair/convention-snapshot
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Preserve legacy work-marker reads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/expectation-gap-detectors.ts")
          text = path.read_text()
          old = "\n".join([
              "const debtMarkerPattern =",
              r"  /^\s*(?:\/{2,}|#+|\/\*+|\*+)\s*(?:TODO(?!:\s*\[coding-tooling:)|FIXME)\b/i;",
              "const workMarkerPattern =",
              r"  /^\s*(?:\/\/|#|\/\*|\*)\s*TODO:\s*\[coding-tooling:([a-z0-9][a-z0-9-]{0,63})\]\s+(.+?)\s*(?:\*\/)?$/i;",
          ])
          new = "\n".join([
              "const debtMarkerPattern =",
              r"  /^\s*(?:\/{2,}|#+|\/\*+|\*+)\s*(?:TODO(?!:\s*\[coding-tooling:|\(coding-tooling:)|FIXME)\b/i;",
              "const workMarkerPatterns = [",
              r"  /^\s*(?:\/\/|#|\/\*|\*)\s*TODO:\s*\[coding-tooling:([a-z0-9][a-z0-9-]{0,63})\]\s+(.+?)\s*(?:\*\/)?$/i,",
              r"  /^\s*(?:\/\/|#|\/\*|\*)\s*TODO\(coding-tooling:([a-z0-9][a-z0-9-]{0,63})\):\s*(.+?)\s*(?:\*\/)?$/i,",
              "];",
          ])
          if old not in text:
              raise SystemExit("work-marker regex block not found")
          text = text.replace(old, new, 1)

          old_parser = "\n".join([
              r"  return content.split(/\r?\n/).flatMap((line, index) => {",
              "    const match = workMarkerPattern.exec(line);",
              "    if (!match?.[1] || !match[2]?.trim()) return [];",
          ])
          new_parser = "\n".join([
              r"  return content.split(/\r?\n/).flatMap((line, index) => {",
              "    const match = workMarkerPatterns",
              "      .map((pattern) => pattern.exec(line))",
              "      .find((candidate) => candidate?.[1] && candidate[2]?.trim());",
              "    if (!match?.[1] || !match[2]?.trim()) return [];",
          ])
          if old_parser not in text:
              raise SystemExit("work-marker parser block not found")
          path.write_text(text.replace(old_parser, new_parser, 1))
          PY
      - name: Add legacy-marker regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/source-work-marker.test.ts")
          text = path.read_text()
          anchor = 'test("does not double-count structured markers as generic TODO debt", () => {'
          test_case = "\n".join([
              'test("continues surfacing legacy generated work markers in test source", () => {',
              "  const root = fixture();",
              "  writeFileSync(",
              '    join(root, "tests", "legacy.test.ts"),',
              "    [",
              '      \'import { test } from "bun:test";\',',
              '      "",',
              '      "// TODO(coding-tooling:test-legacy): Replace the generated scaffold with deterministic assertions.",',
              '      \'test.todo("legacy scaffold");\',',
              '      "",',
              '    ].join("\\n"),',
              "  );",
              "",
              "  const findings = sourceWorkMarkerFindings(createDetectorContext(root));",
              "",
              "  expect(findings).toHaveLength(1);",
              "  expect(findings[0]).toMatchObject({",
              "    subject: {",
              '      key: "tests/legacy.test.ts#coding-tooling:test-legacy",',
              '      path: "tests/legacy.test.ts",',
              "    },",
              "    requirement: {",
              '      key: "resolve-work-marker:test-legacy",',
              '      description: "Replace the generated scaffold with deterministic assertions.",',
              "    },",
              "  });",
              "});",
              "",
              "",
          ])
          if anchor not in text:
              raise SystemExit("legacy test insertion point not found")
          path.write_text(text.replace(anchor, test_case + anchor, 1))
          PY
      - name: Format and validate
        run: |
          bun run format:write
          bun test tests/source-work-marker.test.ts tests/test-scaffold-handoff.test.ts
          bun run format:check
          bun run lint
          bun run typecheck
          bun test
      - name: Remove one-shot workflow
        run: rm .github/workflows/repair-legacy-work-markers-once.yml
      - name: Commit compatibility repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve legacy generated work markers"
          git push origin HEAD:repair/convention-snapshot
