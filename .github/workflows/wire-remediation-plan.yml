name: Wire Remediation Plan

on:
  push:
    branches:
      - remediation/deterministic-candidate-plan-v2

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wire remediation CLI
        run: python3 scripts/patch-remediation-entry.py

      - name: Format focused files
        run: bunx oxfmt@0.65.0 src/entry.ts src/remediation-plan.ts tests/remediation-plan.test.ts

      - name: Run focused tests
        run: bun test tests/remediation-plan.test.ts tests/expectations.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Check whitespace
        run: git diff --check

      - name: Commit durable slice and remove one-shot scaffolding
        run: |
          set -euo pipefail
          rm scripts/patch-remediation-entry.py
          rm .github/workflows/wire-remediation-plan.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/entry.ts src/remediation-plan.ts tests/remediation-plan.test.ts docs/remediation-plan.md scripts/patch-remediation-entry.py .github/workflows/wire-remediation-plan.yml
          git diff --cached --exit-code && {
            echo 'Expected remediation plan changes, but no durable diff remains.' >&2
            exit 1
          }
          git commit -m 'feat: expose deterministic remediation plan'
          git push origin HEAD:remediation/deterministic-candidate-plan-v2
