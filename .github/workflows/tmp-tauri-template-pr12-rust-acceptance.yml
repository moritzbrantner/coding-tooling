name: Temporary tauri-template Actions startup probes

on:
  push:
    branches:
      - tmp/tauri-template-pr12-lock

permissions:
  contents: read

jobs:
  old-checkout:
    name: Old checkout pin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: echo old-checkout-started

  rust-toolchain-action:
    name: dtolnay rust-toolchain pin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: rustc --version
