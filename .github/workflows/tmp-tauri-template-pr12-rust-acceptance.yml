name: Temporary tauri-template PR12 Rust acceptance

on:
  push:
    branches:
      - tmp/tauri-template-pr12-lock

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Verify exact PR source copies
        working-directory: .scratch/tauri-template-pr12/src-tauri
        run: |
          test "$(git hash-object Cargo.toml)" = "7977027e5231602cf2623a6501345e2fbc270ee9"
          test "$(git hash-object crates/guitar-tuner-core/Cargo.toml)" = "c61f1c195398b9b4b01f8a112c114f10d99f54d8"
          test "$(git hash-object crates/guitar-tuner-core/src/lib.rs)" = "4743b8b1244a16141e1c69983314ce153a0a9426"

      - name: Generate exact Rust lockfile
        working-directory: .scratch/tauri-template-pr12/src-tauri
        run: cargo generate-lockfile

      - name: Verify exact audio-analysis revision
        working-directory: .scratch/tauri-template-pr12/src-tauri
        run: grep -F 'git+https://github.com/moritzbrantner/audio-analysis.git?rev=59bf3279811ac36e44139ffb092a979e4bfdaf24#59bf3279811ac36e44139ffb092a979e4bfdaf24' Cargo.lock

      - name: Verify Rust formatting
        working-directory: .scratch/tauri-template-pr12/src-tauri
        run: cargo fmt -- --check

      - name: Run core Clippy
        working-directory: .scratch/tauri-template-pr12/src-tauri
        run: cargo clippy --locked -p guitar-tuner-core --all-targets -- -D warnings

      - name: Run core tests
        working-directory: .scratch/tauri-template-pr12/src-tauri
        run: cargo test --locked -p guitar-tuner-core

      - name: Commit generated lockfile for transfer
        run: |
          git add .scratch/tauri-template-pr12/src-tauri/Cargo.lock
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Generate tauri-template PR12 Cargo.lock"
          git push
