name: Fix component test evidence workflow

on:
  push:
    branches: [feat/component-test-evidence-v2]
    paths:
      - ".github/workflows/fix-component-test-evidence-workflow.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/component-test-evidence-v2
      - name: Preserve state compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/component-test-evidence-v2.yml')
          text = path.read_text()
          old = '              ...outcome,\n              authority: "advisory",\n'
          new = '              ...outcome,\n              state: outcome.status,\n              authority: "advisory",\n'
          if old not in text:
              raise SystemExit('compatibility anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/component-test-evidence-v2.yml
          git commit -m "Preserve change-aware test evidence state"
          git push origin HEAD:feat/component-test-evidence-v2
