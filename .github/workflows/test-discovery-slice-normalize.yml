name: Test discovery slice normalize

on:
  push:
    branches:
      - feat/test-discovery-scope-evidence

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply bounded review fixes
        shell: python
        run: |
          from pathlib import Path

          discovery_path = Path("src/test-discovery-evidence.ts")
          discovery = discovery_path.read_text()

          old_filter = '''  return filters.some((filter) => {
            if (isAbsolute(filter)) return resolve(filter) === absolute;
            return local.includes(filter.replace(/^\\.\\//, ""));
          });'''
          new_filter = '''  return filters.some((filter) => {
            if (isAbsolute(filter)) return resolve(filter) === absolute;
            if (filter.startsWith("./")) return local === filter.slice(2).replaceAll("\\\\", "/");
            return local.includes(filter);
          });'''
          assert old_filter in discovery
          discovery = discovery.replace(old_filter, new_filter, 1)

          reconciliation_anchor = '''  if (discovery.status !== "available") {
            return {
              schemaVersion: 1,
              status: "incomplete",
              discoveredFiles: discovery.discoveredFileCount,
              executedFiles: execution.executedFiles,
              reason: `discovery-${discovery.status}`,
            };
          }'''
          reconciliation_replacement = '''  if (discovery.reason === "vitest-discovery-cross-component") {
            return {
              schemaVersion: 1,
              status: "mismatch",
              discoveredFiles: discovery.discoveredFileCount,
              executedFiles: execution.executedFiles,
              reason: "native-discovery-cross-component",
            };
          }
          if (discovery.status !== "available") {
            return {
              schemaVersion: 1,
              status: "incomplete",
              discoveredFiles: discovery.discoveredFileCount,
              executedFiles: execution.executedFiles,
              reason: `discovery-${discovery.status}`,
            };
          }'''
          assert reconciliation_anchor in discovery
          discovery_path.write_text(discovery.replace(reconciliation_anchor, reconciliation_replacement, 1))

          test_path = Path("tests/test-discovery-evidence.test.ts")
          tests = test_path.read_text()

          bun_anchor = '''  test("reports conventional Bun tests excluded by runner configuration", () => {'''
          bun_test = '''  test("treats an explicit Bun file path as an exact filter", () => {
            const root = repository();
            file(root, "tests/alpha.test.ts");
            file(root, "tests/alpha-extra.test.ts");
            const runner = successfulRunner();

            const result = collectTestDiscoveryEvidence(
              {
                cwd: root,
                capability: "test:unit",
                command: ["bun", "test", "./tests/alpha.test.ts"],
              },
              runner.run,
            );

            expect(result).toMatchObject({
              status: "available",
              discoveredFileCount: 1,
              discoveredFiles: ["tests/alpha.test.ts"],
              excludedFileCount: 1,
            });
          });

          '''
          assert bun_anchor in tests
          tests = tests.replace(bun_anchor, bun_test + bun_anchor, 1)

          cross_anchor = '''    expect(result).toMatchObject({
              status: "incomplete",
              runner: "vitest",
              reason: "vitest-discovery-cross-component",
            });
          });'''
          cross_replacement = '''    expect(result).toMatchObject({
              status: "incomplete",
              runner: "vitest",
              reason: "vitest-discovery-cross-component",
            });

            const execution = collectTestExecutionEvidence({
              cwd: root,
              capability: "test:unit",
              command: ["vitest", "run"],
              stdout: "Test Files  1 passed (1)\\nTests  1 passed (1)",
              stderr: "",
            });
            expect(reconcileTestScope(result, execution)).toMatchObject({
              status: "mismatch",
              reason: "native-discovery-cross-component",
            });
          });'''
          assert cross_anchor in tests
          test_path.write_text(tests.replace(cross_anchor, cross_replacement, 1))
      - name: Normalize and verify focused slice
        run: |
          bun run format:write
          bun run typecheck
          bun test tests/test-discovery-evidence.test.ts tests/test-execution-evidence.test.ts tests/test-execution-validation.test.ts
      - name: Commit normalized slice
        run: |
          unexpected="$(git diff --name-only | grep -v -E '^(src/core\.ts|src/test-discovery-evidence\.ts|src/test-execution-evidence\.ts|tests/test-discovery-evidence\.test\.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected formatter changes:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core.ts src/test-discovery-evidence.ts src/test-execution-evidence.ts tests/test-discovery-evidence.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize test discovery evidence"
          git push origin HEAD:feat/test-discovery-scope-evidence
