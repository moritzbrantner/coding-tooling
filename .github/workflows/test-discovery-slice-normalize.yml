name: Test discovery slice normalize

on:
  push:
    branches:
      - feat/test-discovery-scope-evidence

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply bounded review fixes
        shell: python
        run: |
          from pathlib import Path

          discovery_path = Path("src/test-discovery-evidence.ts")
          lines = discovery_path.read_text().splitlines()

          filter_line = '    return local.includes(filter.replace(/^\\.\\//, ""));'
          filter_index = lines.index(filter_line)
          lines[filter_index:filter_index + 1] = [
              '    if (filter.startsWith("./")) return local === filter.slice(2).replaceAll("\\\\", "/");',
              '    return local.includes(filter);',
          ]

          reconciliation_index = lines.index('  if (discovery.status !== "available") {')
          lines[reconciliation_index:reconciliation_index] = [
              '  if (discovery.reason === "vitest-discovery-cross-component") {',
              '    return {',
              '      schemaVersion: 1,',
              '      status: "mismatch",',
              '      discoveredFiles: discovery.discoveredFileCount,',
              '      executedFiles: execution.executedFiles,',
              '      reason: "native-discovery-cross-component",',
              '    };',
              '  }',
          ]
          discovery_path.write_text("\n".join(lines) + "\n")

          test_path = Path("tests/test-discovery-evidence.test.ts")
          lines = test_path.read_text().splitlines()
          bun_index = lines.index('  test("reports conventional Bun tests excluded by runner configuration", () => {')
          bun_test = [
              '  test("treats an explicit Bun file path as an exact filter", () => {',
              '    const root = repository();',
              '    file(root, "tests/alpha.test.ts");',
              '    file(root, "tests/alpha-extra.test.ts");',
              '    const runner = successfulRunner();',
              '',
              '    const result = collectTestDiscoveryEvidence(',
              '      {',
              '        cwd: root,',
              '        capability: "test:unit",',
              '        command: ["bun", "test", "./tests/alpha.test.ts"],',
              '      },',
              '      runner.run,',
              '    );',
              '',
              '    expect(result).toMatchObject({',
              '      status: "available",',
              '      discoveredFileCount: 1,',
              '      discoveredFiles: ["tests/alpha.test.ts"],',
              '      excludedFileCount: 1,',
              '    });',
              '  });',
              '',
          ]
          lines[bun_index:bun_index] = bun_test

          cross_start = lines.index('  test("fails closed when Vitest lists a test owned by a nested component", () => {')
          reason_index = next(
              index
              for index in range(cross_start, len(lines))
              if 'reason: "vitest-discovery-cross-component"' in lines[index]
          )
          expectation_close = next(
              index
              for index in range(reason_index + 1, len(lines))
              if lines[index] == '    });'
          )
          cross_assertion = [
              '',
              '    const execution = collectTestExecutionEvidence({',
              '      cwd: root,',
              '      capability: "test:unit",',
              '      command: ["vitest", "run"],',
              '      stdout: "Test Files  1 passed (1)\\nTests  1 passed (1)",',
              '      stderr: "",',
              '    });',
              '    expect(reconcileTestScope(result, execution)).toMatchObject({',
              '      status: "mismatch",',
              '      reason: "native-discovery-cross-component",',
              '    });',
          ]
          lines[expectation_close + 1:expectation_close + 1] = cross_assertion
          test_path.write_text("\n".join(lines) + "\n")
      - name: Normalize and verify focused slice
        run: |
          bun run format:write
          bun run typecheck
          bun test tests/test-discovery-evidence.test.ts tests/test-execution-evidence.test.ts tests/test-execution-validation.test.ts
      - name: Commit normalized slice
        run: |
          unexpected="$(git diff --name-only | grep -v -E '^(src/core\.ts|src/test-discovery-evidence\.ts|src/test-execution-evidence\.ts|tests/test-discovery-evidence\.test\.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected formatter changes:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core.ts src/test-discovery-evidence.ts src/test-execution-evidence.ts tests/test-discovery-evidence.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize test discovery evidence"
          git push origin HEAD:feat/test-discovery-scope-evidence
