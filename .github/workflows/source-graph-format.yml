name: Source Graph Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          bun x oxfmt src/fleet-source-deps.ts tests/source-deps-v3.test.ts
          if git diff --quiet -- src/fleet-source-deps.ts tests/source-deps-v3.test.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/fleet-source-deps.ts tests/source-deps-v3.test.ts
          git commit -m "Format cross-platform source graph changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
