name: temporary-format-normalize

on:
  push:
    branches:
      - repair/convention-snapshot

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: repair/convention-snapshot
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Normalize only the expected file
        run: |
          ./node_modules/.bin/oxfmt src/convention-enforcement.ts
          changed="$(git diff --name-only)"
          test "$changed" = "src/convention-enforcement.ts"
      - name: Commit canonical formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/convention-enforcement.ts
          git commit -m "Normalize convention enforcement formatting"
          git push origin HEAD:repair/convention-snapshot
