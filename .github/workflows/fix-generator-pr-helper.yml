name: Fix generator PR helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-generator-pr:
    if: github.head_ref == 'feat/generator-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Remove unused import and format
        run: |
          sed -i 's/existsSync, readFileSync, readdirSync/existsSync, readdirSync/' src/generators.ts
          bun run format:write
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generators.ts
          git commit -m "Fix generator lint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
