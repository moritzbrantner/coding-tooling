name: Wire Guarded Auto Merge

on:
  push:
    branches:
      - merge/guarded-auto-merge-activation

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wire CLI and policy sensitivity
        run: |
          python3 <<'PY'
          from pathlib import Path

          eligibility = Path('src/pr-eligibility.ts')
          source = eligibility.read_text()
          needle = '    path === "src/pr-eligibility.ts" ||\n'
          replacement = needle + '    path === "src/pr-auto-merge.ts" ||\n'
          if source.count(needle) != 1:
              raise SystemExit('unexpected pr-eligibility policy-sensitive anchor')
          eligibility.write_text(source.replace(needle, replacement, 1))

          entry = Path('src/entry.ts')
          source = entry.read_text()
          import_anchor = 'import type { ResultStatus } from "./model.ts";\n'
          import_replacement = (
              import_anchor
              + 'import { activatePullRequestAutoMerge } from "./pr-auto-merge.ts";\n'
              + 'import type { MergeMethod } from "./pr.ts";\n'
          )
          if source.count(import_anchor) != 1:
              raise SystemExit('unexpected entry import anchor')
          source = source.replace(import_anchor, import_replacement, 1)

          usage_anchor = (
              '  coding-tooling pr eligibility <number> [--expected-head <sha>] '
              '[--expected-base <sha>] [--json]\n'
          )
          usage_replacement = usage_anchor + (
              '  coding-tooling pr auto-merge <number> --expected-head <sha> '
              '--expected-base <sha> [--merge-method <squash|merge|rebase>] '
              '[--dry-run] [--json]\n'
          )
          if source.count(usage_anchor) != 1:
              raise SystemExit('unexpected entry usage anchor')
          source = source.replace(usage_anchor, usage_replacement, 1)

          block_anchor = '  if (command === "pr" && argv[1] === "eligibility") {\n'
          lines = [
              '  if (command === "pr" && argv[1] === "auto-merge") {',
              '    const prNumber = Number(argv[2]);',
              '    if (!Number.isInteger(prNumber) || prNumber <= 0) return expectationUsage();',
              '    const knownFlags = new Set([',
              '      "--json",',
              '      "--expected-head",',
              '      "--expected-base",',
              '      "--merge-method",',
              '      "--dry-run",',
              '    ]);',
              '    for (let index = 3; index < argv.length; index += 1) {',
              '      const value = argv[index]!;',
              '      if (!value.startsWith("--") || !knownFlags.has(value)) return expectationUsage();',
              '      if (',
              '        value === "--expected-head" ||',
              '        value === "--expected-base" ||',
              '        value === "--merge-method"',
              '      ) {',
              '        if (!argv[index + 1] || argv[index + 1]!.startsWith("--"))',
              '          return expectationUsage();',
              '        index += 1;',
              '      }',
              '    }',
              '    const mergeMethod = option(argv, "merge-method");',
              '    if (mergeMethod && !["squash", "merge", "rebase"].includes(mergeMethod))',
              '      return expectationUsage();',
              '    const result = activatePullRequestAutoMerge(repositoryRoot(), prNumber, {',
              '      expectedHeadSha: option(argv, "expected-head"),',
              '      expectedBaseSha: option(argv, "expected-base"),',
              '      mergeMethod: mergeMethod as MergeMethod | undefined,',
              '      dryRun: argv.includes("--dry-run"),',
              '    });',
              '    console.log(JSON.stringify(result, null, argv.includes("--json") ? 0 : 2));',
              '    return resultExitCode(result.status);',
              '  }',
              '',
              '',
          ]
          auto_merge_block = '\n'.join(lines)
          if source.count(block_anchor) != 1:
              raise SystemExit('unexpected entry PR eligibility anchor')
          source = source.replace(block_anchor, auto_merge_block + block_anchor, 1)
          entry.write_text(source)
          PY

      - name: Format focused files
        run: bunx oxfmt@0.65.0 src/entry.ts src/pr-eligibility.ts src/pr-auto-merge.ts tests/pr-auto-merge.test.ts

      - name: Run focused tests
        run: bun test tests/pr-auto-merge.test.ts tests/pr-eligibility.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Commit wired implementation and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/wire-guarded-auto-merge.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/entry.ts src/pr-eligibility.ts src/pr-auto-merge.ts tests/pr-auto-merge.test.ts docs/pr-auto-merge.md .github/workflows/wire-guarded-auto-merge.yml
          git diff --cached --exit-code && {
            echo 'Expected guarded auto-merge changes, but no diff remains.' >&2
            exit 1
          }
          git commit -m 'feat: expose guarded auto-merge activation'
          git push origin HEAD:merge/guarded-auto-merge-activation
