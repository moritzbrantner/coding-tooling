name: Fix change-aware review findings

on:
  push:
    branches: [feat/change-aware-pages]
    paths:
      - ".github/workflows/fix-change-aware-review.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/change-aware-pages
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Apply review fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          source_path = Path("site/change-aware.js")
          source = source_path.read_text()

          source = replace(
              source,
              '  const blockingMissing = missing.some((item) => !item.optional);\n',
              '  const scopeIncomplete = scope.unresolvedChangedPaths.length > 0;\n'
              '  const evidenceIncomplete = sourceIncomplete || scopeIncomplete;\n'
              '  const blockingMissing = missing.some((item) => !item.optional);\n',
              "scope completeness insertion",
          )
          source = replace(
              source,
              '  if (scope.mode === "conservative-all")\n',
              '  if (scopeIncomplete)\n'
              '    diagnostics.push({\n'
              '      code: "remote-change-scope-incomplete",\n'
              '      message: `Could not safely map changed paths to repository components: ${scope.unresolvedChangedPaths.join(", ")}`,\n'
              '    });\n'
              '  if (scope.mode === "conservative-all")\n',
              "scope diagnostic insertion",
          )
          source = replace(
              source,
              'sourceIncomplete || blockingMissing ? "unavailable" : "passed"',
              'evidenceIncomplete || blockingMissing ? "unavailable" : "passed"',
              "affected status completeness",
          )
          source = replace(
              source,
              'complete: !sourceIncomplete && !blockingMissing,',
              'complete: !evidenceIncomplete && !blockingMissing,',
              "affected plan completeness",
          )
          source = replace(
              source,
              '    !sourceIncomplete &&\n    !blockingMissing &&',
              '    !evidenceIncomplete &&\n    !blockingMissing &&',
              "plan status completeness",
          )
          source = replace(
              source,
              'complete: !sourceIncomplete && !blockingMissing,',
              'complete: !evidenceIncomplete && !blockingMissing,',
              "plan data completeness",
          )

          source = replace(
              source,
              '    for (const path of paths) {\n'
              '      if (isDocumentationPath(path)) {\n'
              '        documentationPaths.push(path);\n'
              '        continue;\n'
              '      }\n\n'
              '      const globalKinds = globalImpactKinds(path);\n',
              '    for (const path of paths) {\n'
              '      const globalKinds = globalImpactKinds(path);\n',
              "global before docs",
          )
          source = replace(
              source,
              '      const owner = mostSpecificOwner(allComponents, path);\n'
              '      if (owner) addChanged(changedByComponent, owner, path);\n'
              '      else {\n'
              '        unresolvedChangedPaths.push(path);\n'
              '        widenAll = true;\n'
              '        reasons.push(`unresolved-path:${path}`);\n'
              '      }\n',
              '      if (isDocumentationPath(path)) {\n'
              '        documentationPaths.push(path);\n'
              '        continue;\n'
              '      }\n\n'
              '      const owners = mostSpecificOwners(allComponents, path);\n'
              '      if (owners.length > 0) {\n'
              '        for (const owner of owners) addChanged(changedByComponent, owner, path);\n'
              '      } else {\n'
              '        unresolvedChangedPaths.push(path);\n'
              '        widenAll = true;\n'
              '        reasons.push(`unresolved-path:${path}`);\n'
              '      }\n',
              "multi-owner resolution",
          )

          source = replace(
              source,
              '        component: component.name,\n        path: component.path,\n',
              '        component: component.name,\n        kind: component.kind,\n        path: component.path,\n',
              "check kind identity",
          )
          source = replace(
              source,
              '  const present = new Set(\n'
              '    checks.map((check) => `${check.path}:${check.component}:${check.capability}`),\n'
              '  );\n',
              '  const present = new Set(\n'
              '    checks.map(\n'
              '      (check) => `${check.kind}:${check.path}:${check.component}:${check.capability}`,\n'
              '    ),\n'
              '  );\n',
              "present capability identity",
          )
          source = replace(
              source,
              '      if (present.has(`${component.path}:${component.name}:${capability}`)) continue;\n',
              '      if (present.has(`${componentIdentity(component)}:${capability}`)) continue;\n',
              "missing capability identity",
          )

          source = replace(
              source,
              '  const agent = nearestAncestorFile(paths, component.path, "AGENTS.md");\n'
              '  if (agent) contracts.push(agent);\n',
              '  const agentStarts =\n'
              '    changedPaths.length > 0 ? changedPaths.map((changed) => dirname(changed)) : [component.path];\n'
              '  for (const start of agentStarts) {\n'
              '    const agent = nearestAncestorFile(paths, start, "AGENTS.md");\n'
              '    if (agent) contracts.push(agent);\n'
              '  }\n',
              "changed-path AGENTS ancestry",
          )
          source = replace(
              source,
              'function candidateTests(snapshot, component, changedPaths, components) {\n'
              '  const tests = snapshot.tree\n'
              '    .filter(\n'
              '      (entry) =>\n'
              '        entry.type === "blob" &&\n'
              '        isTestPath(entry.path) &&\n'
              '        componentIdentity(mostSpecificOwner(components, entry.path) ?? component) ===\n'
              '          componentIdentity(component),\n'
              '    )\n'
              '    .map((entry) => entry.path);\n',
              'function candidateTests(snapshot, component, changedPaths, components) {\n'
              '  const tests = snapshot.tree\n'
              '    .filter((entry) => {\n'
              '      if (entry.type !== "blob" || !isTestPath(entry.path)) return false;\n'
              '      return mostSpecificOwners(components, entry.path).some(\n'
              '        (owner) => componentIdentity(owner) === componentIdentity(component),\n'
              '      );\n'
              '    })\n'
              '    .map((entry) => entry.path);\n',
              "candidate test ownership",
          )
          source = replace(
              source,
              'function mostSpecificOwner(components, path) {\n'
              '  return components\n'
              '    .filter((component) => componentContains(component, path))\n'
              '    .toSorted(\n'
              '      (left, right) => normalizedComponentPath(right).length - normalizedComponentPath(left).length,\n'
              '    )[0];\n'
              '}\n',
              'function mostSpecificOwners(components, path) {\n'
              '  const matches = components.filter((component) => componentContains(component, path));\n'
              '  if (matches.length === 0) return [];\n'
              '  const maximumPathLength = matches.reduce(\n'
              '    (maximum, component) => Math.max(maximum, normalizedComponentPath(component).length),\n'
              '    -1,\n'
              '  );\n'
              '  return matches.filter(\n'
              '    (component) => normalizedComponentPath(component).length === maximumPathLength,\n'
              '  );\n'
              '}\n',
              "all most-specific owners",
          )
          source_path.write_text(source)

          test_path = Path("tests/site-change-aware.test.js")
          tests = test_path.read_text()
          tests = replace(
              tests,
              '    expect(result.data.scope.affectedComponents[0].governingContracts).toContain(\n'
              '      "packages/a/package.json",\n'
              '    );\n'
              '  });\n',
              '    expect(result.data.scope.affectedComponents[0].governingContracts).toContain(\n'
              '      "packages/a/package.json",\n'
              '    );\n'
              '    expect(result.data.scope.affectedComponents[0].governingContracts).toContain(\n'
              '      "packages/a/src/AGENTS.md",\n'
              '    );\n'
              '  });\n',
              "nested AGENTS assertion",
          )
          tests = replace(
              tests,
              '  test("does not let a component filter weaken conservative widening", () => {\n',
              '  test("treats Markdown convention snapshots as global contracts", () => {\n'
              '    const result = remoteChangeCommandFromSnapshot(\n'
              '      repository(),\n'
              '      change([".conventions/index.md"]),\n'
              '      request("affected"),\n'
              '      now,\n'
              '    );\n\n'
              '    expect(result.data.scope.mode).toBe("conservative-all");\n'
              '    expect(new Set(result.data.validationPlan.checks.map((check) => check.component))).toEqual(\n'
              '      new Set(["fixture", "package-a", "package-b"]),\n'
              '    );\n'
              '  });\n\n'
              '  test("does not let a component filter weaken conservative widening", () => {\n',
              "convention contract regression",
          )
          tests = replace(
              tests,
              '  test("widening is fail-closed when the repository snapshot is incomplete", () => {\n',
              '  test("fails closed when a changed path cannot be mapped to a component", () => {\n'
              '    const result = remoteChangeCommandFromSnapshot(\n'
              '      repositoryWithoutComponents(),\n'
              '      change(["src/app.py"]),\n'
              '      request("affected"),\n'
              '      now,\n'
              '    );\n\n'
              '    expect(result.status).toBe("unavailable");\n'
              '    expect(result.data.validationPlan.complete).toBe(false);\n'
              '    expect(result.data.scope.mode).toBe("conservative-all");\n'
              '    expect(result.data.scope.unresolvedChangedPaths).toEqual(["src/app.py"]);\n'
              '    expect(\n'
              '      result.diagnostics.some(\n'
              '        (diagnostic) => diagnostic.code === "remote-change-scope-incomplete",\n'
              '      ),\n'
              '    ).toBe(true);\n'
              '  });\n\n'
              '  test("widening is fail-closed when the repository snapshot is incomplete", () => {\n',
              "unresolved path regression",
          )
          tests = replace(
              tests,
              '  test("change-aware plan honors an affected component filter", () => {\n',
              '  test("keeps all equally specific co-located component owners", () => {\n'
              '    const result = remoteChangeCommandFromSnapshot(\n'
              '      mixedRootRepository(),\n'
              '      change(["src/lib.rs"]),\n'
              '      request("affected"),\n'
              '      now,\n'
              '    );\n\n'
              '    expect(result.status).toBe("passed");\n'
              '    expect(result.data.scope.mode).toBe("targeted");\n'
              '    expect(\n'
              '      result.data.scope.affectedComponents.map((component) => component.kind).toSorted(),\n'
              '    ).toEqual(["package", "rust"]);\n'
              '    expect(result.data.validationPlan.checks).toHaveLength(4);\n'
              '    expect(new Set(result.data.validationPlan.checks.map((check) => check.kind))).toEqual(\n'
              '      new Set(["package", "rust"]),\n'
              '    );\n'
              '  });\n\n'
              '  test("change-aware plan honors an affected component filter", () => {\n',
              "co-located owner regression",
          )
          tests = replace(
              tests,
              '    blob("packages/a/src/widget.ts", "6"),\n'
              '    blob("packages/a/tests/widget.test.ts", "7"),\n',
              '    blob("packages/a/src/widget.ts", "6"),\n'
              '    blob("packages/a/src/AGENTS.md", "18"),\n'
              '    blob("packages/a/tests/widget.test.ts", "7"),\n',
              "nested AGENTS fixture",
          )
          tests = replace(
              tests,
              'function packageManifest(name) {\n',
              'function repositoryWithoutComponents() {\n'
              '  return {\n'
              '    repository: snapshotRepositoryMetadata(),\n'
              '    tree: [blob("src/app.py", "101")],\n'
              '    files: {},\n'
              '    treeTruncated: false,\n'
              '    manifestFetchTruncated: false,\n'
              '    unreadablePaths: [],\n'
              '  };\n'
              '}\n\n'
              'function mixedRootRepository() {\n'
              '  const snapshot = repository({\n'
              '    files: {\n'
              '      ".coding-tooling.json": JSON.stringify({\n'
              '        schemaVersion: 1,\n'
              '        profile: "mixed-root",\n'
              '        tiers: { fast: ["build", "test:unit"] },\n'
              '        requiredCapabilities: ["build", "test:unit"],\n'
              '      }),\n'
              '      "rust-toolchain.toml": \'[toolchain]\\nchannel = "1.98.0"\\n\',\n'
              '    },\n'
              '  });\n'
              '  return {\n'
              '    ...snapshot,\n'
              '    tree: [\n'
              '      ...snapshot.tree,\n'
              '      blob("Cargo.toml", "102"),\n'
              '      blob("rust-toolchain.toml", "103"),\n'
              '      blob("src/lib.rs", "104"),\n'
              '    ],\n'
              '  };\n'
              '}\n\n'
              'function packageManifest(name) {\n',
              "review fixture helpers",
          )
          test_path.write_text(tests)
          PY
          bunx oxfmt site/change-aware.js tests/site-change-aware.test.js
          bunx oxlint site/change-aware.js tests/site-change-aware.test.js
          bun test tests/site-change-aware.test.js
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/change-aware.js tests/site-change-aware.test.js
          git commit -m "Harden change-aware scope resolution"
          git push origin HEAD:feat/change-aware-pages
