name: Dogfood improved change-aware evidence

on:
  push:
    branches: [feat/change-aware-dogfood-v2]
    paths:
      - ".github/workflows/dogfood-improved-change-aware.yml"

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Assert improved change-aware evidence
        shell: bash
        run: |
          cat > .dogfood-improved.mjs <<'EOF'
          import { remoteChangeCommand } from "./site/change-aware.js";

          const result = await remoteChangeCommand(
            "moritzbrantner/coding-tooling",
            "affected --base 444470d80c6c26fb8a015d01bde85da007064546 --head 7d03f20e70081eb55af9dfeae0e14694523a8b7c --tier self --json",
          );
          console.log(JSON.stringify(result, null, 2));
          if (result.status !== "passed") throw new Error(`unexpected status: ${result.status}`);
          if (result.data.declaredMergeAuthority?.authority !== "hosted")
            throw new Error("hosted merge authority was not exposed");
          const required = result.data.declaredMergeAuthority.requiredChecks;
          for (const check of [
            "dogfood-private-action",
            "Cross-platform / macos-latest",
            "Cross-platform / windows-latest",
          ]) {
            if (!required.includes(check)) throw new Error(`missing declared check: ${check}`);
          }
          if (result.data.declaredMergeAuthority.observedEnforcement !== "not-evaluated")
            throw new Error("Pages must not claim hosted enforcement");
          const component = result.data.scope.affectedComponents.find(
            (candidate) => candidate.name === "coding-tooling",
          );
          if (!component) throw new Error("coding-tooling component was not affected");
          if (!component.governingContracts.includes("site/agent-tool.json"))
            throw new Error("changed agent-tool.json was not recognized as a governing contract");
          if (component.testEvidence?.state !== "satisfied")
            throw new Error(`unexpected test evidence: ${component.testEvidence?.state}`);
          if (!component.candidateTests.includes("tests/site-change-aware.test.js"))
            throw new Error("direct change-aware regression test was not suggested");
          if (component.candidateTests.some((path) => /(^|\/)fixtures?(\/|$)/i.test(path)))
            throw new Error("fixture test leaked into candidate navigation");
          EOF
          bun .dogfood-improved.mjs
          rm .dogfood-improved.mjs
