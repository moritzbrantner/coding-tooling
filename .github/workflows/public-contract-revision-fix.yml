name: Public contract revision fix

on:
  push:
    branches: [feat/http-case-evidence]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/http-case-evidence
      - name: Bind report to captured revision
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/public-contract.ts")
          text = path.read_text()
          old = "      revision: revision(root),\n"
          new = "      revision: currentRevision,\n"
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 2:
              raise SystemExit(f"expected exactly two revision anchors, found {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit source patch
        run: |
          if git diff --quiet -- src/public-contract.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public-contract.ts
          git commit -m "Bind public contract report to verified revision"
          git push origin HEAD:feat/http-case-evidence
