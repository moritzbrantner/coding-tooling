name: One-shot custom lint convention fix

on:
  push:
    branches: ["fix/convention-custom-lint-capability"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Apply narrow convention adapter fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/convention-config.ts")
          source = source_path.read_text()
          old = '''      if (matchingTools.length !== 1) {
            throw new Error(
              `No unique convention configuration adapter matches ${component.name} ${capability}; configured tools: ${tools.join(", ")}`,
            );
          }
          const tool = matchingTools[0]!;
          '''
          new = '''      if (matchingTools.length === 0) continue;
          if (matchingTools.length !== 1) {
            throw new Error(
              `No unique convention configuration adapter matches ${component.name} ${capability}; configured tools: ${tools.join(", ")}`,
            );
          }
          const tool = matchingTools[0]!;
          '''
          if old not in source:
              raise SystemExit("expected convention-config block not found")
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path("tests/convention-tool-config.test.ts")
          test = test_path.read_text()
          test = test.replace(
              'test("inspects the package script selected by capabilityCommands overrides", () => {',
              'test("leaves custom package lint capabilities unchanged when no adapter matches", () => {',
              1,
          )
          old_expectation = '''      expect(() => planChecks({ root: target, tier: "lintOnly" })).toThrow(
            "No unique convention configuration adapter matches",
          );
          '''
          new_expectation = '''      const plan = planChecks({ root: target, tier: "lintOnly" });
          expect(plan.checks).toHaveLength(1);
          expect(plan.checks[0]!.command).toEqual(["bun", "run", "custom-lint"]);
          '''
          if old_expectation not in test:
              raise SystemExit("expected convention test assertion not found")
          test_path.write_text(test.replace(old_expectation, new_expectation, 1))
          PY
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Run focused convention configuration tests
        run: bun test tests/convention-tool-config.test.ts --timeout 15000
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Commit durable slice
        shell: bash
        run: |
          rm .github/workflows/one-shot-custom-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/convention-config.ts tests/convention-tool-config.test.ts .github/workflows/one-shot-custom-lint-fix.yml
          git commit -m "fix: preserve custom lint capabilities"
          git push origin HEAD:fix/convention-custom-lint-capability
