name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Bootstrap action dependencies
        run: bun install --frozen-lockfile
      - name: Format contract-flow validation slice
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/contract-bound-flow-validation'
        run: |
          bunx oxfmt --write src/agent-contract-flow-validation.ts tests/agent-contract-flow-validation.test.ts
          git show HEAD^:.github/workflows/validate.yml > .github/workflows/validate.yml
          git add src/agent-contract-flow-validation.ts tests/agent-contract-flow-validation.test.ts .github/workflows/validate.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format contract-bound flow validation"
          git push origin HEAD:${{ github.head_ref }}
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
      - name: Inspect deterministic repository findings
        uses: ./
        with:
          operation: findings
          report-path: .artifacts/coding-tooling/findings.json
      - name: Inspect repository foundation
        uses: ./
        with:
          operation: foundation
          install-mode: none
          report-path: .artifacts/coding-tooling/foundation.json
      - name: Plan repository foundation
        uses: ./
        with:
          operation: bootstrap-plan
          install-mode: none
          report-path: .artifacts/coding-tooling/bootstrap-plan.json
      - name: Inspect repository score
        if: always()
        uses: ./
        with:
          operation: score
          validation-report: .artifacts/coding-tooling/report.json
          report-path: .artifacts/coding-tooling/score.json

  cross-platform:
    name: Cross-platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run the runtime test suite
        run: bun test --timeout 15000
