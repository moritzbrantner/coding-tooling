name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Bootstrap action dependencies
        run: bun install --frozen-lockfile
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
      - name: Inspect deterministic repository findings
        uses: ./
        with:
          operation: findings
          report-path: .artifacts/coding-tooling/findings.json
      - name: Inspect repository foundation
        uses: ./
        with:
          operation: foundation
          install-mode: none
          report-path: .artifacts/coding-tooling/foundation.json
      - name: Inspect repository score
        if: always()
        uses: ./
        with:
          operation: score
          validation-report: .artifacts/coding-tooling/report.json
          report-path: .artifacts/coding-tooling/score.json

  cross-platform:
    name: Cross-platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run the runtime test suite
        run: bun test --timeout 15000
