name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Bootstrap action dependencies
        run: bun install
      - name: Print formatter diff
        run: |
          bun run format:write
          git diff -- README.md src/source-deps.ts tests/source-deps.test.ts
      - name: Print generated lockfile
        run: |
          echo "LOCKFILE_BEGIN"
          base64 -w0 bun.lock
          echo
          echo "LOCKFILE_END"
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
