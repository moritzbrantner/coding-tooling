name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Bootstrap action dependencies
        run: bun install --frozen-lockfile
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
      - name: Show formatter correction
        if: ${{ failure() }}
        run: |
          bun run format:write
          git diff -- tests/expectation-test-reachability.test.ts
      - name: Inspect deterministic repository findings
        uses: ./
        with:
          operation: findings
          report-path: .artifacts/coding-tooling/findings.json
