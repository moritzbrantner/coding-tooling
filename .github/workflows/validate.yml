name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consumer-node-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write an isolated consumer version file
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/consumer-node-setup"
          printf '22.23.2\n' > "$GITHUB_WORKSPACE/.artifacts/consumer-node-setup/.node-version"
      - name: Set up the consumer's exact Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .artifacts/consumer-node-setup/.node-version
      - name: Verify the installed version
        shell: bash
        run: test "$(node --version)" = 'v22.23.2'

  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Bootstrap action dependencies
        run: bun install --frozen-lockfile
      - name: Verify bootstrap and Pages in an exact clean checkout
        run: bun src/router.ts repository contract --execute --json
      - name: Build Pages browser analyzer
        run: bun run pages:build
      - name: Check the exact static artifact
        run: bun run pages:check
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
      - name: Inspect deterministic repository findings
        uses: ./
        with:
          operation: findings
          report-path: .artifacts/coding-tooling/findings.json
      - name: Inspect repository foundation
        uses: ./
        with:
          operation: foundation
          install-mode: none
          report-path: .artifacts/coding-tooling/foundation.json
      - name: Plan repository foundation
        uses: ./
        with:
          operation: bootstrap-plan
          install-mode: none
          report-path: .artifacts/coding-tooling/bootstrap-plan.json
      - name: Inspect repository score
        if: always()
        uses: ./
        with:
          operation: score
          validation-report: .artifacts/coding-tooling/report.json
          report-path: .artifacts/coding-tooling/score.json

  cross-platform:
    name: Cross-platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run the runtime test suite
        run: bun test --timeout 15000
