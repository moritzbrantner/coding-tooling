name: Validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Bootstrap tooling dependencies
        run: bun install
      - name: Validate approved coding-agent-skills metadata
        run: bun src/cli.ts agent-capabilities validate --root catalog-fixture
