name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Bootstrap action dependencies
        run: bun install
      - name: Format sources for diagnostics
        run: bun run format:write
      - name: Print formatting diff
        run: git diff --no-ext-diff -- package.json src tests
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
