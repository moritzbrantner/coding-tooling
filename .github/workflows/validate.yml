name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dogfood-private-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Bootstrap action dependencies
        run: bun install
      - name: Format sources for diagnostics
        run: bun run format:write
      - name: Print formatted sources
        run: |
          for file in package.json src/cli.ts src/core.ts src/model.ts src/shared.ts tests/core.test.ts; do
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
      - name: Validate through the local Action
        uses: ./
        with:
          tier: self
          install-mode: none
          strict: true
