name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Print canonical formatter diff
        run: |
          bunx oxfmt@0.65.0 src/trusted-merge.ts
          git diff -- src/trusted-merge.ts
          test -n "$(git diff -- src/trusted-merge.ts)"
