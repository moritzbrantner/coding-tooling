name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Print canonical formatted files
        shell: bash
        run: |
          for file in src/fleet-source-deps.ts src/router.ts src/source-aware-pipeline.ts src/source-deps.ts src/source-graph.ts; do
            echo "===== $file BEGIN ====="
            bun x oxfmt --stdin-filepath "$file" < "$file"
            echo "===== $file END ====="
          done
