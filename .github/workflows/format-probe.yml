name: Format Probe

on:
  push:
    branches:
      - merge/trusted-pr-eligibility

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply canonical formatter output
        run: |
          bun run format:write
          git add src/entry.ts src/merge-readiness.ts src/pr-eligibility.ts tests/pr-eligibility.test.ts docs/pr-eligibility-collector.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Apply canonical formatting"
          git push origin HEAD:merge/trusted-pr-eligibility
