name: Branch Format Diagnostic

on:
  push:
    branches:
      - feat/descriptive-agent-landscape-20260925
    paths:
      - ".github/workflows/branch-format-diagnostic.yml"
      - "scripts/build-landscape-snapshot.ts"
      - "site/landscape.js"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/descriptive-agent-landscape-20260925
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply canonical formatting
        run: |
          bun run format:write
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-landscape-snapshot.ts site/landscape.js
          git commit -m "Apply repository formatting"
          git push origin HEAD:feat/descriptive-agent-landscape-20260925
