name: temporary-wrapper-review-repair

on:
  push:
    branches:
      - feat/remote-validation-wrapper-evidence

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/remote-validation-wrapper-evidence
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Apply exact review repairs
        run: python3 .github/scripts/temporary-wrapper-review-repair.py
      - name: Canonically format repaired files
        run: |
          ./node_modules/.bin/oxfmt \
            site/evidence-model.js \
            site/execution-evidence.js \
            tests/scoped-remote-validation.test.js \
            tests/remote-execution-evidence.test.js
      - name: Validate review repairs
        run: |
          bun test \
            tests/scoped-remote-validation.test.js \
            tests/remote-validation-evidence.test.js \
            tests/remote-execution-evidence.test.js \
            tests/site-preflight.test.js \
            tests/pages-evidence-quality-regressions.test.js
          bun run format:check
          bun run lint
          bun run typecheck
      - name: Guard repair scope
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/execution-evidence.md \
            docs/github-pages-analysis.md \
            site/evidence-model.js \
            site/execution-evidence.js \
            tests/remote-execution-evidence.test.js \
            tests/scoped-remote-validation.test.js | sort)"
          test "$changed" = "$expected"
      - name: Commit review repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/execution-evidence.md \
            docs/github-pages-analysis.md \
            site/evidence-model.js \
            site/execution-evidence.js \
            tests/remote-execution-evidence.test.js \
            tests/scoped-remote-validation.test.js
          git commit -m "Keep wrapper validation fail closed"
          git push origin HEAD:feat/remote-validation-wrapper-evidence
