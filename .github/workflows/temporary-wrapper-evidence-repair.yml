name: temporary-wrapper-evidence-repair

on:
  push:
    branches:
      - feat/remote-validation-wrapper-evidence

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/remote-validation-wrapper-evidence
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Apply bounded remote wrapper evidence slice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected exactly one regex match in {path}, found {count}")
              file.write_text(updated)

          replace_once(
              "site/evidence-model.js",
              "  const declaredCommands = normalizeDeclaredCommands(input.declaredCommands);\n",
              "  const declaredCommands = normalizeDeclaredCommands(input.declaredCommands);\n  const packageScripts = normalizePackageScripts(input.packageScripts);\n",
          )
          replace_once(
              "site/evidence-model.js",
              "        declaredCommands,\n        localActionIsCodingTooling: Boolean(input.localActionIsCodingTooling),",
              "        declaredCommands,\n        packageScripts,\n        localActionIsCodingTooling: Boolean(input.localActionIsCodingTooling),",
          )
          replace_once(
              "site/evidence-model.js",
              "function analyzeWorkflowValidation(input) {",
              '''function normalizePackageScripts(values) {
            return (values ?? [])
              .flatMap((value) => {
                const workingDirectory = normalizeWorkingDirectory(value?.workingDirectory ?? ".");
                const manager = value?.manager === "bun" || value?.manager === "npm" ? value.manager : null;
                const scripts = strings(value?.scripts);
                if (workingDirectory === null || manager === null || Object.keys(scripts).length === 0) {
                  return [];
                }
                return [{ workingDirectory, manager, scripts }];
              })
              .toSorted(
                (left, right) =>
                  left.workingDirectory.localeCompare(right.workingDirectory) ||
                  left.manager.localeCompare(right.manager),
              );
          }

          function analyzeWorkflowValidation(input) {''',
          )
          regex_once(
              "site/evidence-model.js",
              r'function analyzeWorkflowValidation\(input\) \{.*?\n\}\n\nfunction workflowHasRelevantTrigger',
              '''function analyzeWorkflowValidation(input) {
            const relevantTrigger = workflowHasRelevantTrigger(input.content, input.defaultBranch);
            const literalMatchedCommandEvidence = input.declaredCommands.filter((command) =>
              workflowRunsCommand(input.content, command),
            );
            const matchedPackageScriptEvidence = input.packageScripts.flatMap((packageEvidence) =>
              workflowPackageScriptValidationEvidence(
                input.content,
                packageEvidence,
                input.declaredCommands,
              ),
            );
            const wrapperMatchedCommandKeys = new Set(
              matchedPackageScriptEvidence.flatMap((evidence) =>
                evidence.matchedCommands.map(
                  (command) => `${evidence.workingDirectory}\\0${command}`,
                ),
              ),
            );
            const matchedCommandEvidence = input.declaredCommands.filter(
              (command) =>
                literalMatchedCommandEvidence.some(
                  (literal) =>
                    literal.command === command.command &&
                    literal.workingDirectory === command.workingDirectory,
                ) ||
                wrapperMatchedCommandKeys.has(`${command.workingDirectory}\\0${command.command}`),
            );
            const matchedCommands = [
              ...new Set(matchedCommandEvidence.map((command) => command.command)),
            ].toSorted();
            const codingToolingAction = workflowUsesCodingToolingAction(
              input.content,
              input.localActionIsCodingTooling,
            );
            const validationInvocation = matchedCommandEvidence.length > 0 || codingToolingAction;
            return {
              path: input.path,
              status: relevantTrigger && validationInvocation ? "satisfied" : "finding",
              relevantTrigger,
              validationInvocation,
              matchedCommands,
              matchedCommandEvidence,
              matchedPackageScriptEvidence,
              codingToolingAction,
            };
          }

          function workflowPackageScriptValidationEvidence(content, packageEvidence, declaredCommands) {
            const declared = declaredCommands.filter(
              (command) => command.workingDirectory === packageEvidence.workingDirectory,
            );
            if (declared.length === 0) return [];
            const results = [];
            for (const script of Object.keys(packageEvidence.scripts).toSorted()) {
              const wrapperCommand = `${packageEvidence.manager} run ${script}`;
              if (
                !workflowRunsCommand(content, {
                  command: wrapperCommand,
                  workingDirectory: packageEvidence.workingDirectory,
                })
              ) {
                continue;
              }
              const matchedCommands = resolvePackageScriptValidation(
                packageEvidence.scripts,
                packageEvidence.manager,
                script,
                declared,
              );
              if (matchedCommands.length === 0) continue;
              results.push({
                command: wrapperCommand,
                script,
                workingDirectory: packageEvidence.workingDirectory,
                matchedCommands,
              });
            }
            return results.toSorted(
              (left, right) =>
                left.workingDirectory.localeCompare(right.workingDirectory) ||
                left.command.localeCompare(right.command),
            );
          }

          function resolvePackageScriptValidation(
            scripts,
            manager,
            script,
            declaredCommands,
            seen = new Set(),
          ) {
            if (seen.has(script) || seen.size >= 16) return [];
            const source = scripts[script];
            if (typeof source !== "string" || !source.trim()) return [];
            const nextSeen = new Set(seen);
            nextSeen.add(script);
            const matches = new Set();
            for (const segment of boundedPackageScriptSegments(source)) {
              for (const declared of declaredCommands) {
                if (shellCommandMatches(segment, declared.command)) matches.add(declared.command);
              }
              const referencedScript = packageScriptReference(segment, manager);
              if (!referencedScript) continue;
              const canonicalReference = `${manager} run ${referencedScript}`;
              for (const declared of declaredCommands) {
                if (declared.command === canonicalReference) matches.add(declared.command);
              }
              for (const matched of resolvePackageScriptValidation(
                scripts,
                manager,
                referencedScript,
                declaredCommands,
                nextSeen,
              )) {
                matches.add(matched);
              }
            }
            return [...matches].toSorted();
          }

          function boundedPackageScriptSegments(source) {
            const value = String(source).trim();
            if (!value || /[;|`\\n\\r]/.test(value) || value.includes("$(")) return [];
            return value
              .split(/\\s*&&\\s*/)
              .map((segment) => segment.trim())
              .filter(Boolean);
          }

          function packageScriptReference(segment, manager) {
            const run = segment.match(
              new RegExp(`^${manager}\\\\s+run\\\\s+([A-Za-z0-9:_-]+)(?:\\\\s+--(?:\\\\s+.*)?)?$`),
            );
            if (run) return run[1];
            if (manager === "npm") {
              const shorthand = segment.match(/^npm\\s+(test|start|stop|restart)(?:\\s+--(?:\\s+.*)?)?$/);
              if (shorthand) return shorthand[1];
            }
            return null;
          }

          function workflowHasRelevantTrigger''',
          )

          regex_once(
              "site/preflight.js",
              r'function validationEvidenceFor\(snapshot, paths, components\) \{.*?\n\}\n\nfunction isExternalCiPath',
              '''function validationEvidenceFor(snapshot, paths, components) {
            const workflowPaths = [...paths]
              .filter((path) => /^\\.github\\/workflows\\/.+\\.ya?ml$/i.test(path))
              .toSorted();
            const externalCiPaths = [...paths].filter(isExternalCiPath).toSorted();
            const declaredCommands = components.flatMap((component) =>
              Object.values(component.capabilities ?? {})
                .filter(Array.isArray)
                .map((command) => ({
                  command: command.join(" "),
                  workingDirectory: component.path,
                })),
            );
            const packageScripts = components.flatMap((component) => {
              if (component.kind !== "package") return [];
              const scripts = component.evidence?.facts?.scripts;
              if (scripts?.status !== "available") return [];
              const manager =
                component.toolchain?.manager === "bun" || component.toolchain?.manager === "npm"
                  ? component.toolchain.manager
                  : packageCommandManager(component.evidence);
              if (manager !== "bun" && manager !== "npm") return [];
              return [
                {
                  workingDirectory: component.path,
                  manager,
                  scripts: scripts.value,
                },
              ];
            });
            const workflows = workflowPaths
              .filter((path) => typeof snapshot.files[path] === "string")
              .map((path) => ({ path, content: snapshot.files[path] }));
            return remoteValidationOutcome({
              workflowPaths,
              workflows,
              externalCiPaths,
              workflowFetchTruncated: Boolean(snapshot.workflowFetchTruncated),
              defaultBranch: snapshot.repository.defaultBranch,
              declaredCommands,
              packageScripts,
              localActionIsCodingTooling: isCodingToolingAction(snapshot.files["action.yml"]),
            });
          }

          function isExternalCiPath''',
          )

          replace_once(
              "tests/scoped-remote-validation.test.js",
              '''function validation(workflow, declaredCommands) {
            return remoteValidationOutcome({
              workflowPaths: [".github/workflows/validate.yml"],
              workflows: [{ path: ".github/workflows/validate.yml", content: workflow }],
              externalCiPaths: [],
              workflowFetchTruncated: false,
              defaultBranch: "main",
              declaredCommands,
            });
          }''',
              '''function validation(workflow, declaredCommands, packageScripts = []) {
            return remoteValidationOutcome({
              workflowPaths: [".github/workflows/validate.yml"],
              workflows: [{ path: ".github/workflows/validate.yml", content: workflow }],
              externalCiPaths: [],
              workflowFetchTruncated: false,
              defaultBranch: "main",
              declaredCommands,
              packageScripts,
            });
          }''',
          )
          replace_once(
              "tests/scoped-remote-validation.test.js",
              '''function workspaceSnapshot(workflow) {
            const root = {
              name: "root",
              packageManager: "bun@1.4.0",
              workspaces: ["packages/*"],
              scripts: {},
            };
            const app = { name: "app", scripts: { lint: "oxlint ." } };''',
              '''function workspaceSnapshot(workflow, appScripts = { lint: "oxlint ." }) {
            const root = {
              name: "root",
              packageManager: "bun@1.4.0",
              workspaces: ["packages/*"],
              scripts: {},
            };
            const app = { name: "app", scripts: appScripts };''',
          )
          replace_once(
              "tests/scoped-remote-validation.test.js",
              '''  test("workspace inheritance keeps validation command evidence component-scoped", () => {''',
              '''  test("a bounded package-script wrapper can prove a declared validation command", () => {
            const result = validation(
              `${pullRequestPrefix}      - run: npm run verify:web\\n`,
              [{ command: "npm run test:unit", workingDirectory: "." }],
              [
                {
                  workingDirectory: ".",
                  manager: "npm",
                  scripts: {
                    "verify:web": "npm run verify:tests",
                    "verify:tests": "npm test",
                    test: "npm run test:unit",
                    "test:unit": "vitest run",
                  },
                },
              ],
            );

            expect(result.status).toBe("satisfied");
            expect(result.workflowEvidence[0].matchedCommands).toEqual(["npm run test:unit"]);
            expect(result.workflowEvidence[0].matchedPackageScriptEvidence).toEqual([
              {
                command: "npm run verify:web",
                script: "verify:web",
                workingDirectory: ".",
                matchedCommands: ["npm run test:unit"],
              },
            ]);
          });

          test("cyclic package-script wrappers remain non-validating", () => {
            const result = validation(
              `${pullRequestPrefix}      - run: npm run verify\\n`,
              [{ command: "npm run test:unit", workingDirectory: "." }],
              [
                {
                  workingDirectory: ".",
                  manager: "npm",
                  scripts: { verify: "npm run inner", inner: "npm run verify" },
                },
              ],
            );

            expect(result.status).toBe("finding");
            expect(result.workflowEvidence[0].matchedPackageScriptEvidence).toEqual([]);
          });

          test("deployment-only wrappers do not satisfy validation evidence", () => {
            const result = validation(
              `${pullRequestPrefix}      - run: npm run deploy\\n`,
              [{ command: "npm run test:unit", workingDirectory: "." }],
              [
                {
                  workingDirectory: ".",
                  manager: "npm",
                  scripts: { deploy: "npm run build", build: "vite build" },
                },
              ],
            );

            expect(result.status).toBe("finding");
            expect(result.workflowEvidence[0].matchedCommands).toEqual([]);
          });

          test("Pages preflight resolves a nested Bun validation wrapper from fetched package scripts", () => {
            const analysis = analyzeSnapshot(
              workspaceSnapshot(
                `${pullRequestPrefix}      - name: Verify app\\n        working-directory: packages/app\\n        run: bun run verify:web\\n`,
                {
                  "test:unit": "bun test",
                  build: "vite build",
                  "verify:web": "bun run verify:checks",
                  "verify:checks": "bun run test:unit && bun run build",
                },
              ),
            );

            expect(analysis.validationEvidence.status).toBe("satisfied");
            expect(analysis.validationEvidence.workflowEvidence[0].matchedPackageScriptEvidence).toEqual([
              {
                command: "bun run verify:web",
                script: "verify:web",
                workingDirectory: "packages/app",
                matchedCommands: ["bun run build", "bun run test:unit"],
              },
            ]);
          });

          test("workspace inheritance keeps validation command evidence component-scoped", () => {''',
          )
          PY
      - name: Canonically format changed files
        run: |
          ./node_modules/.bin/oxfmt \
            site/evidence-model.js \
            site/preflight.js \
            tests/scoped-remote-validation.test.js
      - name: Validate focused wrapper evidence
        run: |
          bun test tests/scoped-remote-validation.test.js tests/site-preflight.test.js tests/pages-evidence-quality-regressions.test.js
          bun run format:check
          bun run lint
          bun run typecheck
      - name: Guard implementation scope
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            site/evidence-model.js \
            site/preflight.js \
            tests/scoped-remote-validation.test.js | sort)"
          test "$changed" = "$expected"
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/evidence-model.js site/preflight.js tests/scoped-remote-validation.test.js
          git commit -m "Resolve remote validation script wrappers"
          git push origin HEAD:feat/remote-validation-wrapper-evidence
