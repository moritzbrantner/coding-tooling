name: Refine Index Enforcement

on:
  push:
    branches:
      - fix/index-backed-convention-enforcement

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply and verify refinement
        run: |
          bun scripts/refine-index-enforcement.mjs
          bun run format:write
          bun test tests/convention-enforcement.test.ts
          bun run typecheck
          git rm scripts/refine-index-enforcement.mjs .github/workflows/refine-index-enforcement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/convention-enforcement.ts tests/convention-enforcement.test.ts
          git commit -m "Preserve untracked convention coverage"
          git push origin HEAD:fix/index-backed-convention-enforcement
