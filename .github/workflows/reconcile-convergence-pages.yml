name: Reconcile convergence Pages changes

on:
  push:
    branches:
      - feat/stronger-repository-convergence

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/stronger-repository-convergence
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Restore current main Pages analyzer and layer deployment parity only
        run: |
          git fetch origin main
          git checkout origin/main -- site/preflight.js tests/site-preflight.test.js
          python3 - <<'PY'
          from pathlib import Path

          preflight = Path("site/preflight.js")
          content = preflight.read_text()

          helper = r'''
          const PAGES_DEPLOYMENT_PATTERN =
            /(?:actions\/upload-pages-artifact|actions\/deploy-pages|deploy-pages\.ya?ml|pages:\s*write)/i;
          const EXACT_ARTIFACT_CONSUMER_PATTERN =
            /(?:prebuilt_artifact_(?:run_id|name|digest|source_sha|key|identity_digest|destination)|actions\/download-artifact)/i;
          const RUNTIME_VERIFICATION_PATTERN =
            /(?:playwright|e2e_command|test:e2e|browser(?:[-:_ ]?smoke)?|vite\s+preview|next\s+start)/i;
          const BUILD_INVOCATION_PATTERN =
            /(?:\b(?:vite|next|nuxt|astro|vitepress|react-scripts|webpack)\b[^\n]*\bbuild\b|\b(?:bun|npm|pnpm|yarn)\s+(?:run\s+)?build(?::[A-Za-z0-9:_-]+)?\b)/i;
          const PRODUCTION_ENVIRONMENT_PATTERN =
            /\b((?:VITE|NEXT_PUBLIC|NUXT_PUBLIC|PUBLIC|REACT_APP)_[A-Z0-9_]+)\s*=\s*(?:"[^"]*"|'[^']*'|[^\s\\]+)/g;
          const BASE_PATH_PATTERN = /(?:^|\s)--base(?:\s+|=)(?:"[^"]+"|'[^']+'|[^\s\\]+)/g;

          function commandBlocks(content) {
            const lines = content.split(/\r?\n/);
            const blocks = [];
            for (let index = 0; index < lines.length; index += 1) {
              const line = lines[index];
              const match = line.match(/^(\s*)(?:-\s+)?(?:run|build_command):\s*(.*)$/);
              if (!match) continue;
              const indent = match[1].length;
              const inline = match[2].trim();
              if (inline && inline !== "|" && inline !== ">") {
                blocks.push(inline);
                continue;
              }

              const block = [];
              for (index += 1; index < lines.length; index += 1) {
                const next = lines[index];
                if (!next.trim()) {
                  block.push("");
                  continue;
                }
                const nextIndent = next.match(/^\s*/)[0].length;
                if (nextIndent <= indent) {
                  index -= 1;
                  break;
                }
                block.push(next.trim());
              }
              blocks.push(block.join("\n"));
            }
            return blocks;
          }

          function deploymentRuntimeParityGaps(snapshot) {
            return Object.entries(snapshot.files)
              .filter(([path]) => /^\.github\/workflows\/.+\.ya?ml$/i.test(path))
              .flatMap(([path, source]) => {
                if (typeof source !== "string" || !PAGES_DEPLOYMENT_PATTERN.test(source)) return [];
                const signals = new Set();
                for (const command of commandBlocks(source)) {
                  if (!BUILD_INVOCATION_PATTERN.test(command)) continue;
                  for (const match of command.matchAll(PRODUCTION_ENVIRONMENT_PATTERN)) {
                    if (match[1]) signals.add(`production environment ${match[1]}`);
                  }
                  for (const match of command.matchAll(BASE_PATH_PATTERN)) {
                    signals.add(`production ${match[0].trim()}`);
                  }
                }
                if (signals.size === 0) return [];
                if (
                  EXACT_ARTIFACT_CONSUMER_PATTERN.test(source) &&
                  RUNTIME_VERIFICATION_PATTERN.test(source)
                ) {
                  return [];
                }
                return [{ path, signals: [...signals].toSorted() }];
              });
          }

          '''
          marker = "function findingsFor(snapshot, paths, components, validationEvidence) {\n"
          if marker not in content:
              raise SystemExit("preflight findings marker not found")
          content = content.replace(marker, helper + marker, 1)

          gap_loop = r'''
            for (const gap of deploymentRuntimeParityGaps(snapshot))
              add(
                `REMOTE-DEPLOY-${stableId(gap.path)}`,
                "medium",
                "Pages runtime variant is not verified from the deploy artifact",
                `${gap.path} contains ${gap.signals.join(", ")} without browser/runtime validation consuming the produced artifact.`,
                "Validate the exact produced Pages artifact under its production runtime/base-path conditions before deployment.",
              );

          '''
          insert_before = "  const renovate = [...paths].some((path) =>\n"
          if insert_before not in content:
              raise SystemExit("preflight updater marker not found")
          content = content.replace(insert_before, gap_loop + insert_before, 1)
          preflight.write_text(content)

          tests = Path("tests/site-preflight.test.js")
          test_content = tests.read_text()
          tests_to_add = r'''
            test("reports a production-only Pages runtime variant without exact-artifact browser verification", () => {
              const analysis = analyzeSnapshot(
                repository({
                  tree: [
                    blob("package.json", "1"),
                    blob(".coding-tooling.json", "2"),
                    blob("AGENTS.md", "3"),
                    blob("renovate.json", "4"),
                    blob(".github/workflows/pages.yml", "5"),
                  ],
                  files: {
                    "package.json": JSON.stringify({
                      name: "fixture",
                      packageManager: "bun@1.4.0",
                      scripts: { test: "test" },
                    }),
                    ".coding-tooling.json": JSON.stringify({ schemaVersion: 1 }),
                    ".github/workflows/pages.yml": `name: Pages
          on:
            pull_request:
          permissions:
            pages: write
          jobs:
            build:
              steps:
                - run: VITE_HOSTED_RUNTIME=1 bunx vite build --base /fixture/
                - uses: actions/upload-pages-artifact@0123456789012345678901234567890123456789
            smoke:
              steps:
                - run: bun run test:browser:smoke
          `,
                  },
                }),
              );
              expect(analysis.findings.some((finding) => finding.id.startsWith("REMOTE-DEPLOY-"))).toBe(
                true,
              );
            });

            test("ignores remote public runtime variables outside build commands", () => {
              const analysis = analyzeSnapshot(
                repository({
                  tree: [
                    blob("package.json", "1"),
                    blob(".coding-tooling.json", "2"),
                    blob("AGENTS.md", "3"),
                    blob("renovate.json", "4"),
                    blob(".github/workflows/pages.yml", "5"),
                  ],
                  files: {
                    "package.json": JSON.stringify({
                      name: "fixture",
                      packageManager: "bun@1.4.0",
                      scripts: { test: "test" },
                    }),
                    ".coding-tooling.json": JSON.stringify({ schemaVersion: 1 }),
                    ".github/workflows/pages.yml": `name: Pages
          on:
            pull_request:
          permissions:
            pages: write
          jobs:
            build:
              steps:
                - run: bun run build
                - uses: actions/upload-pages-artifact@0123456789012345678901234567890123456789
            diagnostics:
              steps:
                - run: VITE_DIAGNOSTIC_MODE=1 bun run inspect
          `,
                  },
                }),
              );
              expect(analysis.findings.some((finding) => finding.id.startsWith("REMOTE-DEPLOY-"))).toBe(
                false,
              );
            });

            test("accepts remote Pages runtime verification that consumes the produced artifact", () => {
              const analysis = analyzeSnapshot(
                repository({
                  tree: [
                    blob("package.json", "1"),
                    blob(".coding-tooling.json", "2"),
                    blob("AGENTS.md", "3"),
                    blob("renovate.json", "4"),
                    blob(".github/workflows/pages.yml", "5"),
                  ],
                  files: {
                    "package.json": JSON.stringify({
                      name: "fixture",
                      packageManager: "bun@1.4.0",
                      scripts: { test: "test" },
                    }),
                    ".coding-tooling.json": JSON.stringify({ schemaVersion: 1 }),
                    ".github/workflows/pages.yml": `name: Pages
          on:
            pull_request:
          permissions:
            pages: write
          jobs:
            build:
              uses: owner/reusable/.github/workflows/build-artifact.yml@0123456789012345678901234567890123456789
              with:
                build_command: VITE_HOSTED_RUNTIME=1 bunx vite build --base /fixture/
                artifact_paths: dist
            verify:
              needs: build
              uses: owner/reusable/.github/workflows/e2e-validation.yml@0123456789012345678901234567890123456789
              with:
                prebuilt_artifact_run_id: producer-run
                prebuilt_artifact_digest: producer-digest
                e2e_command: bunx playwright test --config playwright.hosted.config.ts
            deploy:
              needs: [build, verify]
              uses: owner/reusable/.github/workflows/deploy-pages.yml@0123456789012345678901234567890123456789
          `,
                  },
                }),
              );
              expect(analysis.findings.some((finding) => finding.id.startsWith("REMOTE-DEPLOY-"))).toBe(
                false,
              );
            });

          '''
          test_marker = '  test("represents external CI as unsupported rather than missing validation", () => {\n'
          if test_marker not in test_content:
              raise SystemExit("site preflight test marker not found")
          test_content = test_content.replace(test_marker, tests_to_add + test_marker, 1)
          tests.write_text(test_content)

          registry = Path("tests/expectation-registry-contract.test.ts")
          registry_content = registry.read_text()
          registry_content = registry_content.replace(
              '      "benchmark-evidence",\n      "dotnet-type-assignability",',
              '      "benchmark-evidence",\n      "deployment-runtime-parity",\n      "dotnet-type-assignability",',
              1,
          )
          registry_content = registry_content.replace(
              '      ["benchmark-evidence", 1],\n      ["dotnet-type-assignability", 1],',
              '      ["benchmark-evidence", 1],\n      ["deployment-runtime-parity", 1],\n      ["dotnet-type-assignability", 1],',
              1,
          )
          registry.write_text(registry_content)
          PY
      - run: bunx oxfmt .
      - run: bun run typecheck
      - run: bun test tests/remote-snapshot-acquisition.test.js tests/expectation-registry-contract.test.ts tests/site-preflight.test.js tests/deployment-runtime-parity.test.ts tests/deployment-runtime-parity-integration.test.ts tests/open-pr-reconciliation.test.ts tests/convergence-repository-state.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/preflight.js tests/site-preflight.test.js tests/expectation-registry-contract.test.ts
          git commit -m 'Reconcile Pages analyzer with current main'
          git push origin HEAD:feat/stronger-repository-convergence
