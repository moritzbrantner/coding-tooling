name: Repair convention markers once

on:
  push:
    branches: [repair/convention-snapshot]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: repair/convention-snapshot
      - name: Check out current convention source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: ce5961767492011483cd9234cdf991e482d8de1d
          path: .tmp/coding-agent-conventions
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Migrate structured work markers to REPO-010 syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          literal_paths = [
              Path("docs/convergence.md"),
              Path("src/expectation-detectors.ts"),
              Path("src/expectation-test-detector.ts"),
              Path("tests/source-work-marker.test.ts"),
          ]
          for path in literal_paths:
              text = path.read_text()
              text = re.sub(r"TODO\(coding-tooling:([^)]+)\):", r"TODO: [coding-tooling:\1]", text)
              text = text.replace(
                  "Structured TODO(coding-tooling:...) markers are owned by source-work-marker instead of being double-counted here.",
                  "Structured TODO: [coding-tooling:<key>] markers are owned by source-work-marker instead of being double-counted here.",
              )
              path.write_text(text)

          path = Path("src/expectation-gap-detectors.ts")
          text = path.read_text()
          old_debt = r"const debtMarkerPattern = /^\s*(?:\/{2,}|#+|\/\*+|\*+)\s*(?:TODO(?!\(coding-tooling:)|FIXME)\b/i;"
          new_debt = r"const debtMarkerPattern = /^\s*(?:\/{2,}|#+|\/\*+|\*+)\s*(?:TODO(?!:\s*\[coding-tooling:)|FIXME)\b/i;"
          old_work = r"  /^\s*(?:\/\/|#|\/\*|\*)\s*TODO\(coding-tooling:([a-z0-9][a-z0-9-]{0,63})\):\s*(.+?)\s*(?:\*\/)?$/i;"
          new_work = r"  /^\s*(?:\/\/|#|\/\*|\*)\s*TODO:\s*\[coding-tooling:([a-z0-9][a-z0-9-]{0,63})\]\s+(.+?)\s*(?:\*\/)?$/i;"
          if old_debt not in text or old_work not in text:
              raise SystemExit("expected work-marker patterns were not found")
          text = text.replace(old_debt, new_debt).replace(old_work, new_work)
          text = text.replace(
              "`TODO(coding-tooling:${marker.key}) on line ${marker.line}: ${marker.instruction}`",
              "`TODO: [coding-tooling:${marker.key}] on line ${marker.line}: ${marker.instruction}`",
          )
          path.write_text(text)
          PY
      - name: Add convention-compatibility regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/convention-enforcement.test.ts")
          text = path.read_text()
          needle = '    writeFileSync(source, "// TODO: make retry limit configurable\\n");\n    expect(runConventionChecks(root, discoverComponents(root)).status).toBe("passed");\n\n'
          replacement = needle + '    writeFileSync(source, "// TODO: [coding-tooling:generated-test] replace generated scaffold\\n");\n    expect(runConventionChecks(root, discoverComponents(root)).status).toBe("passed");\n\n'
          if needle not in text:
              raise SystemExit("TODO-format test insertion point was not found")
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Refresh managed snapshot from merged convention source
        run: bun src/cli.ts conventions update --conventions-root .tmp/coding-agent-conventions --json
      - name: Remove temporary convention checkout
        run: rm -rf .tmp
      - name: Format repaired repository files
        run: bun run format:write
      - name: Verify marker and convention contracts
        run: |
          bun src/cli.ts conventions check --json
          bun test tests/source-work-marker.test.ts tests/convention-enforcement.test.ts
          bun src/cli.ts run --tier self --config .coding-tooling.json --json
          ! grep -R -F 'TODO(coding-tooling:' docs src tests
          grep -F '"sourceRevision": "ce5961767492011483cd9234cdf991e482d8de1d"' conventions.lock.json
      - name: Run repository validation
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun test
      - name: Remove one-shot workflow
        run: rm .github/workflows/repair-convention-markers-once.yml
      - name: Commit repaired contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align work markers with managed TODO convention"
          git push origin HEAD:repair/convention-snapshot
