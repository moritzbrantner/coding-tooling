name: Reconciliation format debug

on:
  push:
    branches:
      - reconcile/mutators-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Print canonical format
        run: |
          bunx oxfmt tests/reconciliation.test.ts
          printf '%s\n' '---BEGIN-FORMATTED---'
          cat tests/reconciliation.test.ts
          printf '%s\n' '---END-FORMATTED---'
