name: Wire Repository Evidence

on:
  push:
    branches:
      - evidence/repository-envelope-v1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add repository evidence operation
        run: sed -i '/| "repository-metadata"/a\  | "repository-evidence"' src/model.ts

      - name: Format focused files
        run: bunx oxfmt@0.65.0 src/entry.ts src/model.ts src/repository-evidence.ts tests/repository-evidence.test.ts

      - name: Run focused tests
        run: bun test tests/repository-evidence.test.ts tests/merge-readiness.test.ts tests/foundation-audit.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Check whitespace
        run: git diff --check

      - name: Commit operation model and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/wire-repository-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/model.ts .github/workflows/wire-repository-evidence.yml
          git diff --cached --exit-code && {
            echo 'Expected repository evidence model changes, but no durable diff remains.' >&2
            exit 1
          }
          git commit -m 'feat: register repository evidence operation'
          git push origin HEAD:evidence/repository-envelope-v1
