name: Wire Repository Evidence

on:
  push:
    branches:
      - evidence/repository-envelope-v1

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wire CLI and operation model
        run: python3 scripts/patch-repository-evidence-entry.py

      - name: Format focused files
        run: bunx oxfmt@0.65.0 src/entry.ts src/model.ts src/repository-evidence.ts tests/repository-evidence.test.ts

      - name: Run focused tests
        run: bun test tests/repository-evidence.test.ts tests/merge-readiness.test.ts tests/foundation-audit.test.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Check whitespace
        run: git diff --check

      - name: Commit durable slice and remove one-shot scaffolding
        run: |
          set -euo pipefail
          rm scripts/patch-repository-evidence-entry.py
          rm .github/workflows/wire-repository-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/entry.ts src/model.ts src/repository-evidence.ts tests/repository-evidence.test.ts docs/repository-evidence.md scripts/patch-repository-evidence-entry.py .github/workflows/wire-repository-evidence.yml
          git diff --cached --exit-code && {
            echo 'Expected repository evidence changes, but no durable diff remains.' >&2
            exit 1
          }
          git commit -m 'feat: expose repository evidence envelope v1'
          git push origin HEAD:evidence/repository-envelope-v1
