name: Format performance contract rollout

on:
  push:
    branches:
      - perf/performance-contract-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: perf/performance-contract-v1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt src/expectation-gap-detectors.ts tests/performance-contract-expectation.test.ts
      - name: Commit canonical formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/expectation-gap-detectors.ts tests/performance-contract-expectation.test.ts
          git commit -m "Format performance contract guard"
          git push origin HEAD:perf/performance-contract-v1
