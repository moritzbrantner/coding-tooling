name: Dogfood convergence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  converge-self:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Capture findings
        run: |
          bun src/entry.ts findings --all --json | tee /tmp/findings.json
      - name: Run convergence and show worktree delta
        shell: bash
        run: |
          set +e
          bun src/entry.ts converge --no-verify --json | tee /tmp/converge.json
          status=${PIPESTATUS[0]}
          echo "converge_exit=$status"
          echo "--- git status ---"
          git status --short
          echo "--- tracked diff ---"
          git diff -- .
          echo "--- untracked files ---"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            echo "--- $path ---"
            sed -n '1,220p' "$path"
          done < <(git ls-files --others --exclude-standard)
          exit 0
