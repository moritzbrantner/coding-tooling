name: Fix inline push validation evidence

on:
  push:
    branches: [feat/remote-validation-evidence-v1]
    paths:
      - ".github/workflows/fix-inline-push-evidence.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/remote-validation-evidence-v1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Fix inline push branch handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("site/evidence-model.js")
          source = source_path.read_text()
          old = '''  const pushInline = push.text.replace(/^push\\s*:\\s*/, "");
            if (pushInline && pushInline !== "{}") return true;
          '''
          new = '''  const pushInline = push.text.replace(/^push\\s*:\\s*/, "");
            if (pushInline) return inlinePushRelevant(pushInline, defaultBranch);
          '''
          if old not in source:
              raise SystemExit("inline push anchor not found")
          source = source.replace(old, new, 1)

          marker = '''function workflowRunsCommand(content, command) {
          '''
          helper = '''function inlinePushRelevant(value, defaultBranch) {
            const trimmed = String(value).trim();
            if (trimmed === "{}") return true;
            if (!trimmed.startsWith("{") || !trimmed.endsWith("}")) return false;
            const body = trimmed.slice(1, -1);
            const branches = body.match(/(?:^|,)\\s*branches\\s*:\\s*(\\[[^\\]]*\\])/);
            if (branches) return yamlListValues(branches[1]).includes(defaultBranch);
            const ignored = body.match(/(?:^|,)\\s*branches-ignore\\s*:\\s*(\\[[^\\]]*\\])/);
            if (ignored) return !yamlListValues(ignored[1]).includes(defaultBranch);
            return true;
          }

          '''
          if marker not in source:
              raise SystemExit("inline push helper anchor not found")
          source_path.write_text(source.replace(marker, helper + marker, 1))

          test_path = Path("tests/remote-validation-evidence.test.js")
          tests = test_path.read_text()
          marker = '''  test("deployment-only workflows do not prove validation", () => {
          '''
          addition = '''  test("inline push branch filters must include the default branch", () => {
            const offDefault = remoteValidationOutcome({
              workflowPaths: [".github/workflows/validate.yml"],
              workflows: [{
                path: ".github/workflows/validate.yml",
                content: `on:\\n  push: { branches: [develop] }\\njobs:\\n  verify:\\n    steps:\\n      - run: bun run typecheck\\n`,
              }],
              externalCiPaths: [],
              workflowFetchTruncated: false,
              defaultBranch: "main",
              declaredCommands: ["bun run typecheck"],
            });
            expect(offDefault.status).toBe("finding");
            expect(offDefault.workflowEvidence[0].relevantTrigger).toBe(false);

            const onDefault = remoteValidationOutcome({
              workflowPaths: [".github/workflows/validate.yml"],
              workflows: [{
                path: ".github/workflows/validate.yml",
                content: `on:\\n  push: { branches: [main] }\\njobs:\\n  verify:\\n    steps:\\n      - run: bun run typecheck\\n`,
              }],
              externalCiPaths: [],
              workflowFetchTruncated: false,
              defaultBranch: "main",
              declaredCommands: ["bun run typecheck"],
            });
            expect(onDefault.status).toBe("satisfied");
            expect(onDefault.workflowEvidence[0].relevantTrigger).toBe(true);
          });

          '''
          if marker not in tests:
              raise SystemExit("inline push test anchor not found")
          test_path.write_text(tests.replace(marker, addition + marker, 1))
          PY
          bunx oxfmt site/evidence-model.js tests/remote-validation-evidence.test.js
          bunx oxlint site/evidence-model.js tests/remote-validation-evidence.test.js
          bun test tests/remote-validation-evidence.test.js tests/site-preflight.test.js tests/site-change-aware.test.js tests/rust-remote-test-evidence.test.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/evidence-model.js tests/remote-validation-evidence.test.js
          git commit -m "Respect inline push branch filters"
          git push origin HEAD:feat/remote-validation-evidence-v1
