name: Format lifecycle diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Print exact formatter patch
        run: |
          bun run format:write
          git diff -- src/repository-metadata.ts tests/repository-metadata.test.ts
          test -z "$(git status --short -- src/repository-metadata.ts tests/repository-metadata.test.ts)"
