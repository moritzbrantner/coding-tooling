name: Clean component test evidence fixture warning

on:
  push:
    branches: [feat/component-test-evidence-v2]
    paths:
      - ".github/workflows/fix-component-test-warning.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/component-test-evidence-v2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Clean fixture warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/site-preflight.test.js')
          text = path.read_text()
          old = '''    const manifest = (name) => ({
              name,
              packageManager: "bun@1.4.0",
              scripts: { "format:check": "fmt", lint: "lint", typecheck: "tsc", test: "test" },
            });
          '''
          new = '''    function manifest(name) {
              return {
                name,
                packageManager: "bun@1.4.0",
                scripts: { "format:check": "fmt", lint: "lint", typecheck: "tsc", test: "test" },
              };
            }
          '''
          if old not in text:
              raise SystemExit('manifest fixture anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          bunx oxfmt tests/site-preflight.test.js
          bunx oxlint tests/site-preflight.test.js
          bun test tests/site-preflight.test.js tests/normalized-evidence.test.js tests/site-change-aware.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/site-preflight.test.js
          git commit -m "Clean component test evidence fixture"
          git push origin HEAD:feat/component-test-evidence-v2
