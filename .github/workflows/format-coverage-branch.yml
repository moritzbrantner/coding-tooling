name: Format Coverage Branch

on:
  push:
    branches: [feat/coverage-publication-protocol]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:write
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-test-coverage-snapshot.js site/test-coverage.js tests/site-test-coverage.test.js
          git commit -m "style: apply repository formatter"
          git push
