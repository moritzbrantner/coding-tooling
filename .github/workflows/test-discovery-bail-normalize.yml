name: Test discovery bail normalize

on:
  push:
    branches:
      - feat/test-discovery-scope-evidence

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply bail parsing regression fix
        shell: python
        run: |
          from pathlib import Path

          discovery_path = Path("src/test-discovery-evidence.ts")
          lines = discovery_path.read_text().splitlines()
          bail_index = lines.index('  "--bail",')
          del lines[bail_index]
          boolean_end = lines.index(']);', lines.index('const bunBooleanFlags = new Set(['))
          lines[boolean_end:boolean_end] = ['  "--bail",']
          coverage_index = next(
              index for index, line in enumerate(lines)
              if 'value.startsWith("--coverage-reporter=")' in line
          )
          lines[coverage_index:coverage_index] = [
              '    if (value.startsWith("--bail=")) continue;',
          ]
          discovery_path.write_text("\n".join(lines) + "\n")

          test_path = Path("tests/test-discovery-evidence.test.ts")
          lines = test_path.read_text().splitlines()
          insertion = lines.index('  test("treats an explicit Bun file path as an exact filter", () => {')
          regression = [
              '  test("does not consume a Bun file filter after bare bail", () => {',
              '    const root = repository();',
              '    file(root, "tests/alpha.test.ts");',
              '    file(root, "tests/beta.test.ts");',
              '    const runner = successfulRunner();',
              '',
              '    const result = collectTestDiscoveryEvidence(',
              '      {',
              '        cwd: root,',
              '        capability: "test:unit",',
              '        command: ["bun", "test", "--bail", "./tests/alpha.test.ts"],',
              '      },',
              '      runner.run,',
              '    );',
              '',
              '    expect(result).toMatchObject({',
              '      status: "available",',
              '      discoveredFileCount: 1,',
              '      discoveredFiles: ["tests/alpha.test.ts"],',
              '    });',
              '  });',
              '',
          ]
          lines[insertion:insertion] = regression
          test_path.write_text("\n".join(lines) + "\n")
      - name: Normalize and verify focused slice
        run: |
          bun run format:write
          bun run typecheck
          bun test tests/test-discovery-evidence.test.ts tests/test-execution-evidence.test.ts tests/test-execution-validation.test.ts
      - name: Commit normalized slice
        run: |
          unexpected="$(git diff --name-only | grep -v -E '^(src/test-discovery-evidence\.ts|tests/test-discovery-evidence\.test\.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected formatter changes:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test-discovery-evidence.ts tests/test-discovery-evidence.test.ts
          git commit -m "Handle bare Bun bail during discovery"
          git push origin HEAD:feat/test-discovery-scope-evidence
