name: Format convergence repair

on:
  push:
    branches: [fix/foundation-convention-adapter-evidence]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: fix/foundation-convention-adapter-evidence
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Format repair files and remove this temporary workflow
        run: |
          bun x oxfmt src/foundation-audit.ts tests/foundation-convention-tooling.test.ts
          rm .github/workflows/format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/foundation-audit.ts tests/foundation-convention-tooling.test.ts .github/workflows/format-repair.yml
          git commit -m "chore: format convention adapter evidence"
          git push origin HEAD:fix/foundation-convention-adapter-evidence
