name: Enforcement executable evidence repair

on:
  push:
    branches:
      - fix/enforcement-executable-evidence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: fix/enforcement-executable-evidence

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repair
        run: python3 .github/enforcement-evidence-repair.py

      - name: Format and validate repair
        run: |
          bun run format:write src/convention-enforcement.ts src/foundation-audit.ts tests/foundation-convention-tooling.test.ts
          bun test tests/foundation-convention-tooling.test.ts tests/convention-enforcement.test.ts --timeout 15000
          bun run typecheck
          bun run lint

      - name: Commit repair
        run: |
          rm .github/workflows/enforcement-evidence-repair.yml .github/enforcement-evidence-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/convention-enforcement.ts src/foundation-audit.ts tests/foundation-convention-tooling.test.ts .github/workflows/enforcement-evidence-repair.yml .github/enforcement-evidence-repair.py
          git commit -m "fix: audit enforcement-only convention executables"
          git push origin HEAD:fix/enforcement-executable-evidence
