name: HTTP case evidence patch

on:
  push:
    branches: [feat/http-case-evidence]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: feat/http-case-evidence
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: python scripts/apply-http-case-evidence.py
      - run: bun run format:write
      - name: Commit source patch
        run: |
          if git diff --quiet -- src/public-contract.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public-contract.ts
          git commit -m "Require exact HTTP behavioral case evidence"
          git push origin HEAD:feat/http-case-evidence
