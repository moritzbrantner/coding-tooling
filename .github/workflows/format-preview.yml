name: Format Preview

on:
  push:
    branches: [feat/layered-convergence-validation]

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/layered-convergence-validation
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Commit formatter output
        shell: bash
        run: |
          bun run format:write
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/convergence.ts
          git commit -m "Apply deterministic convergence formatting"
          git push origin HEAD:feat/layered-convergence-validation
