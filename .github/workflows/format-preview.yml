name: Format Preview

on:
  push:
    branches:
      - feat/remote-validation-wrapper-evidence

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Show authoritative format diff
        run: |
          bun run format:write
          git --no-pager diff -- site/evidence-model.js site/execution-evidence.js tests/remote-execution-evidence.test.js tests/scoped-remote-validation.test.js
          test -z "$(git status --porcelain -- site/evidence-model.js site/execution-evidence.js tests/remote-execution-evidence.test.js tests/scoped-remote-validation.test.js)"
