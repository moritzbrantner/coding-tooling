name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Print canonical formatter diff
        shell: bash
        run: |
          bunx oxfmt .
          git diff -- site/preflight.js site/workspace-toolchain.js tests/workspace-toolchain-preflight.test.js
