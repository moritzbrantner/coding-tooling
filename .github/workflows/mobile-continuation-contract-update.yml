name: Mobile continuation contract update

on:
  push:
    branches:
      - feature/mobile-analysis-artifact-continuation

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Finalize mobile artifact continuation contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Update versioned detector contract
        run: |
          python - <<'PY'
          from pathlib import Path

          detector = Path("src/expectation-detectors.ts")
          text = detector.read_text()
          old = '''  {
            id: "mobile-analysis-orchestration",
            version: 1,
            description:
              "Configured mobile analysis is wired to run automatically after an applicable Pages deployment",
            defaultSeverity: "warning",
            policyKind: "advisory",
            evidenceContract: {
              basis: "configuration",
              oracle: "mobile-analysis-config-and-pages-workflow",
              independenceKey: "mobile-analysis-orchestration",
              proves:
                "A repository with explicit mobile-analysis configuration and a recognized Pages deployment has matching post-deployment reusable-workflow wiring.",
              limitations: [
                "Does not execute mobile-analysis or prove that the deployed URL is reachable.",
                "Only GitHub Pages deployment workflows are auto-orchestrated in this version; other hosting systems remain not-applicable.",
                "Multiple recognized Pages deployment workflows are treated as ambiguous rather than guessed.",
              ],
            },
            detect: mobileAnalysisOrchestrationFindings,
          },'''
          new = '''  {
            id: "mobile-analysis-orchestration",
            version: 2,
            description:
              "Configured mobile analysis continues exact-revision Pages evidence into read-only remediation planning",
            defaultSeverity: "warning",
            policyKind: "advisory",
            evidenceContract: {
              basis: "configuration",
              oracle: "mobile-analysis-config-and-pages-workflow",
              independenceKey: "mobile-analysis-orchestration",
              proves:
                "A repository with explicit mobile-analysis configuration and one recognized Pages deployment wires the exact deployed revision into mobile-analysis and feeds its same-run evidence artifact into pinned read-only coding-tooling remediation planning.",
              limitations: [
                "Does not execute mobile-analysis or prove that the deployed URL is reachable.",
                "Manual workflow dispatch may run analysis for inspection but is deliberately excluded from automatic remediation continuation because it lacks a proven Pages deployment revision.",
                "Only GitHub Pages deployment workflows are auto-orchestrated in this version; other hosting systems remain not-applicable.",
                "Multiple recognized Pages deployment workflows are treated as ambiguous rather than guessed.",
              ],
            },
            detect: mobileAnalysisOrchestrationFindings,
          },'''
          if text.count(old) != 1:
              raise SystemExit("mobile-analysis detector contract did not match exactly once")
          detector.write_text(text.replace(old, new))

          contract_test = Path("tests/expectation-registry-contract.test.ts")
          test_text = contract_test.read_text()
          old_version = '["mobile-analysis-orchestration", 1],'
          if test_text.count(old_version) != 1:
              raise SystemExit("mobile-analysis registry version did not match exactly once")
          contract_test.write_text(test_text.replace(old_version, '["mobile-analysis-orchestration", 2],'))
          PY
          bun run format:write
      - name: Commit contract update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/expectation-detectors.ts src/expectation-mobile-analysis-detector.ts tests/expectation-registry-contract.test.ts tests/mobile-analysis-orchestration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize mobile artifact continuation contract'
          git push
