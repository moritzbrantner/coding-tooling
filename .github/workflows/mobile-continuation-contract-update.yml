name: Mobile continuation contract update

on:
  push:
    branches:
      - feature/mobile-analysis-artifact-continuation

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Finalize mobile artifact continuation contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Update versioned detector contract
        run: |
          python - <<'PY'
          from pathlib import Path

          detector = Path("src/expectation-detectors.ts")
          lines = detector.read_text().splitlines(keepends=True)
          id_line = '    id: "mobile-analysis-orchestration",\n'
          matches = [index for index, line in enumerate(lines) if line == id_line]
          if len(matches) != 1:
              raise SystemExit("mobile-analysis detector id did not match exactly once")
          start = matches[0] - 1
          end = next(
              index for index in range(matches[0], len(lines))
              if lines[index] == "    detect: mobileAnalysisOrchestrationFindings,\n"
          ) + 2
          replacement = [
              "  {\n",
              '    id: "mobile-analysis-orchestration",\n',
              "    version: 2,\n",
              "    description:\n",
              '      "Configured mobile analysis continues exact-revision Pages evidence into read-only remediation planning",\n',
              '    defaultSeverity: "warning",\n',
              '    policyKind: "advisory",\n',
              "    evidenceContract: {\n",
              '      basis: "configuration",\n',
              '      oracle: "mobile-analysis-config-and-pages-workflow",\n',
              '      independenceKey: "mobile-analysis-orchestration",\n',
              "      proves:\n",
              '        "A repository with explicit mobile-analysis configuration and one recognized Pages deployment wires the exact deployed revision into mobile-analysis and feeds its same-run evidence artifact into pinned read-only coding-tooling remediation planning.",\n',
              "      limitations: [\n",
              '        "Does not execute mobile-analysis or prove that the deployed URL is reachable.",\n',
              '        "Manual workflow dispatch may run analysis for inspection but is deliberately excluded from automatic remediation continuation because it lacks a proven Pages deployment revision.",\n',
              '        "Only GitHub Pages deployment workflows are auto-orchestrated in this version; other hosting systems remain not-applicable.",\n',
              '        "Multiple recognized Pages deployment workflows are treated as ambiguous rather than guessed.",\n',
              "      ],\n",
              "    },\n",
              "    detect: mobileAnalysisOrchestrationFindings,\n",
              "  },\n",
          ]
          detector.write_text("".join(lines[:start] + replacement + lines[end:]))

          contract_test = Path("tests/expectation-registry-contract.test.ts")
          test_text = contract_test.read_text()
          old_version = '["mobile-analysis-orchestration", 1],'
          if test_text.count(old_version) != 1:
              raise SystemExit("mobile-analysis registry version did not match exactly once")
          contract_test.write_text(test_text.replace(old_version, '["mobile-analysis-orchestration", 2],'))
          PY
          bun run format:write
      - name: Commit contract update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/expectation-detectors.ts src/expectation-mobile-analysis-detector.ts tests/expectation-registry-contract.test.ts tests/mobile-analysis-orchestration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize mobile artifact continuation contract'
          git push
