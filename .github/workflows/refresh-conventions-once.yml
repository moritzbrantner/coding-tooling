name: Refresh conventions once

on:
  push:
    branches: [repair/convention-snapshot]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: repair/convention-snapshot
      - name: Check out convention source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 02c853fd280cde06c778b3437789f8f57cb438ed
          path: .tmp/coding-agent-conventions
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Regenerate managed convention snapshot
        run: bun src/cli.ts conventions update --conventions-root .tmp/coding-agent-conventions --json
      - name: Verify regenerated snapshot
        run: |
          bun src/cli.ts conventions check --json
          ! grep -R -E 'AGENT-001|AGENT-007|AGENT-008' .conventions .coding-tooling.json
      - name: Remove temporary checkout and workflow
        run: |
          rm -rf .tmp
          rm .github/workflows/refresh-conventions-once.yml
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .conventions conventions.lock.json .github/workflows/refresh-conventions-once.yml
          if git diff --cached --quiet; then
            echo "No generated convention changes"
            exit 0
          fi
          git commit -m "Regenerate managed convention snapshot"
          git push origin HEAD:repair/convention-snapshot
