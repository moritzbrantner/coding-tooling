name: Retry component test fixture cleanup

on:
  push:
    branches: [feat/component-test-evidence-v2]
    paths:
      - ".github/workflows/fix-component-test-warning-v2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/component-test-evidence-v2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Clean fixture warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('tests/site-preflight.test.js')
          text = path.read_text()
          pattern = re.compile(r'    const manifest = \(name\) => \(\{\n(.*?)\n    \}\);\n    const analysis', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('manifest fixture block not found')
          replacement = '    function manifest(name) {\n      return {\n' + match.group(1) + '\n      };\n    }\n    const analysis'
          path.write_text(pattern.sub(replacement, text, count=1))
          PY
          bunx oxfmt tests/site-preflight.test.js
          bunx oxlint tests/site-preflight.test.js
          bun test tests/site-preflight.test.js tests/normalized-evidence.test.js tests/site-change-aware.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/site-preflight.test.js
          git commit -m "Clean component test evidence fixture"
          git push origin HEAD:feat/component-test-evidence-v2
