name: One-shot commented env examples

on:
  push:
    branches: ["fix/env-example-commented-keys"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Accept commented environment examples
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/convention-enforcement.ts')
          source = source_path.read_text()
          old = '    const match = line.match(/^\\s*(?:export\\s+)?([A-Za-z_][A-Za-z0-9_]*)\\s*=/);\n'
          new = '    const match = line.match(/^\\s*(?:#\\s*)?(?:export\\s+)?([A-Za-z_][A-Za-z0-9_]*)\\s*=/);\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one env-file parser line, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/convention-enforcement.test.ts')
          test = test_path.read_text()
          old_test = '    writeFileSync(join(root, ".env.example"), "API_URL=\\n");\n'
          new_test = '    writeFileSync(join(root, ".env.example"), "# API_URL=\\n");\n'
          if test.count(old_test) != 1:
              raise SystemExit(f'expected one env example fixture, found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Run focused convention enforcement tests
        run: bun test tests/convention-enforcement.test.ts --timeout 15000
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Commit durable slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-env-commented-keys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/convention-enforcement.ts tests/convention-enforcement.test.ts .github/workflows/one-shot-env-commented-keys.yml
          git commit -m "fix: accept commented environment examples"
          git push origin HEAD:fix/env-example-commented-keys
