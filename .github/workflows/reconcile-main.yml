name: Reconcile Performance Contract Main

on:
  push:
    branches:
      - perf/performance-contract-v1

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Merge current main and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/reconcile-main.yml
          git commit --amend --no-edit
          git push origin HEAD:perf/performance-contract-v1
