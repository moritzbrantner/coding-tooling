name: Review Repairs

on:
  push:
    branches: [agent-work-receipts]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: agent-work-receipts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Separate machine verification from semantic review requirements
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/agent-work.ts")
          text = path.read_text()
          text = text.replace("evidence?: string[];", "reviewRequirements?: string[];")
          text = text.replace("requiredEvidence: string[];", "reviewRequirements: string[];")
          text = re.sub(r"requiredEvidence: \[[^\]]*\],", "reviewRequirements: [],", text)
          text = text.replace("explicitEvidence: string[] = []", "explicitReviewRequirements: string[] = []")
          text = text.replace("requiredEvidence: uniqueSorted([", "reviewRequirements: uniqueSorted([")
          text = text.replace("...kinds.flatMap((kind) => kindEvidence[kind].requiredEvidence),", "...kinds.flatMap((kind) => kindEvidence[kind].reviewRequirements),")
          text = text.replace("...explicitEvidence,", "...explicitReviewRequirements,")
          text = text.replace("let acceptanceEvidence: string[] = [];", "let reviewRequirements: string[] = [];")
          text = text.replace("acceptance.evidence", "acceptance.reviewRequirements")
          text = text.replace("task-packet-evidence-invalid", "task-packet-review-requirements-invalid")
          text = text.replace("acceptance.evidence must contain non-empty strings", "acceptance.reviewRequirements must contain non-empty strings")
          text = text.replace("else acceptanceEvidence = evidence;", "else reviewRequirements = evidence;")
          text = text.replace("requiredCapabilities.length > 0 || acceptanceEvidence.length > 0", "requiredCapabilities.length > 0 || reviewRequirements.length > 0")
          text = text.replace("if (acceptanceEvidence.length > 0) packet.acceptance.evidence = acceptanceEvidence;", "if (reviewRequirements.length > 0) packet.acceptance.reviewRequirements = reviewRequirements;")
          path.write_text(text)

          docs = Path("docs/agent-work.md")
          text = docs.read_text()
          text = text.replace('"evidence": ["missing intermediate delta is rejected"]', '"reviewRequirements": ["missing intermediate delta is rejected"]')
          text = text.replace("Explicit acceptance capabilities and evidence are additive.", "Explicit acceptance capabilities and semantic review requirements are additive.")
          marker = "A missing required capability is unavailable evidence, not a passing result."
          replacement = marker + " Semantic review requirements are carried into handoff/integration review and are never presented as machine-verified evidence."
          text = text.replace(marker, replacement)
          docs.write_text(text)
      - run: bun run format:write
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Separate verification from semantic review evidence"
          git push origin HEAD:agent-work-receipts
