name: Review Repairs

on:
  push:
    branches: [agent-work-receipts]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: agent-work-receipts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Separate machine verification from semantic review requirements
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/agent-work.ts")
          text = path.read_text()
          text = text.replace("evidence?: string[];", "reviewRequirements?: string[];")
          text = text.replace("requiredEvidence: string[];", "reviewRequirements: string[];")
          text = re.sub(r"requiredEvidence: \[[^\]]*\],", "reviewRequirements: [],", text)
          text = text.replace("explicitEvidence", "explicitReviewRequirements")
          text = text.replace("requiredEvidence", "reviewRequirements")
          text = text.replace("acceptanceEvidence", "reviewRequirements")
          text = text.replace("acceptance.evidence", "acceptance.reviewRequirements")
          text = text.replace("acceptance?.evidence", "acceptance?.reviewRequirements")
          text = text.replace("task-packet-evidence-invalid", "task-packet-review-requirements-invalid")
          text = text.replace("acceptance.reviewRequirements must contain non-empty strings", "acceptance.reviewRequirements must contain non-empty strings")
          path.write_text(text)

          tests = Path("tests/agent-work.test.ts")
          text = tests.read_text()
          text = text.replace("requiredEvidence", "reviewRequirements")
          text = text.replace("evidence: [", "reviewRequirements: [")
          text = re.sub(
              r'reviewRequirements: \[\n\s+"deterministic-replay",\n\s+"equivalent-workload-benchmark",\n\s+"representative-browser-journey",\n\s+"versioned-or-declared-baseline",\n\s+\],',
              'reviewRequirements: [],',
              text,
          )
          text = text.replace(
              'reviewRequirements: ["authority-boundary", "behavior-regression"]',
              'reviewRequirements: ["authority-boundary"]',
          )
          tests.write_text(text)

          docs = Path("docs/agent-work.md")
          text = docs.read_text()
          text = text.replace('"evidence": ["missing intermediate delta is rejected"]', '"reviewRequirements": ["missing intermediate delta is rejected"]')
          text = text.replace("Explicit acceptance capabilities and evidence are additive.", "Explicit acceptance capabilities and semantic review requirements are additive.")
          marker = "A missing required capability is unavailable evidence, not a passing result."
          replacement = marker + " Semantic review requirements are carried into handoff/integration review and are never presented as machine-verified evidence."
          if marker in text and replacement not in text:
              text = text.replace(marker, replacement)
          docs.write_text(text)
      - run: bun run format:write
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Separate verification from semantic review evidence"
          git push origin HEAD:agent-work-receipts
