name: Format normalized evidence docs

on:
  push:
    branches: [feat/component-test-evidence-v2]
    paths:
      - ".github/workflows/format-component-test-docs.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/component-test-evidence-v2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Format normalized evidence docs
        run: bunx oxfmt docs/normalized-evidence.md
      - name: Commit formatted docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/normalized-evidence.md
          git commit -m "Format normalized evidence docs"
          git push origin HEAD:feat/component-test-evidence-v2
