name: Env contract shell fix

on:
  push:
    branches:
      - fix/env-contract-shell-scoped-vars

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: fix/env-contract-shell-scoped-vars
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Ignore internally assigned shell-scoped variables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/convention-enforcement.ts')
          text = source.read_text()
          old = '''function envKeysFromSource(content: string): string[] {\n  const expressions = [\n    /\\b(?:process|Bun)\\.env\\.([A-Z][A-Z0-9_]*)/g,\n    /\\bimport\\.meta\\.env\\.([A-Z][A-Z0-9_]*)/g,\n    /\\bDeno\\.env\\.get\\(\\s*["']([A-Z][A-Z0-9_]*)["']\\s*\\)/g,\n    /\\bstd::env::var(?:_os)?\\(\\s*["']([A-Z][A-Z0-9_]*)["']\\s*\\)/g,\n    /\\bEnvironment\\.GetEnvironmentVariable\\(\\s*["']([A-Z][A-Z0-9_]*)["']\\s*\\)/g,\n  ];\n  const keys = new Set<string>();\n  for (const expression of expressions) {\n    for (const match of content.matchAll(expression)) keys.add(match[1]);\n  }\n  return [...keys].filter((key) => !isAmbientEnvironmentKey(key));\n}\n'''
          new = '''function shellAssignedEnvironmentKeys(content: string): Set<string> {\n  const assigned = new Set<string>();\n  for (const line of content.split(/\\r?\\n/)) {\n    const match = line.match(/^\\s*(?:export\\s+)?([A-Z][A-Z0-9_]*)\\s*=(.*)$/);\n    if (!match) continue;\n    const [, key, value] = match;\n    if (value.includes(`$${key}`) || value.includes("${" + key + "}")) continue;\n    assigned.add(key);\n  }\n  return assigned;\n}\n\nfunction envKeysFromSource(content: string, extension?: string): string[] {\n  const expressions = [\n    /\\b(?:process|Bun)\\.env\\.([A-Z][A-Z0-9_]*)/g,\n    /\\bimport\\.meta\\.env\\.([A-Z][A-Z0-9_]*)/g,\n    /\\bDeno\\.env\\.get\\(\\s*["']([A-Z][A-Z0-9_]*)["']\\s*\\)/g,\n    /\\bstd::env::var(?:_os)?\\(\\s*["']([A-Z][A-Z0-9_]*)["']\\s*\\)/g,\n    /\\bEnvironment\\.GetEnvironmentVariable\\(\\s*["']([A-Z][A-Z0-9_]*)["']\\s*\\)/g,\n  ];\n  const keys = new Set<string>();\n  for (const expression of expressions) {\n    for (const match of content.matchAll(expression)) keys.add(match[1]);\n  }\n  const shellAssigned = extension === ".sh" ? shellAssignedEnvironmentKeys(content) : new Set<string>();\n  return [...keys].filter(\n    (key) => !isAmbientEnvironmentKey(key) && !shellAssigned.has(key),\n  );\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one envKeysFromSource block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_call = 'const keys = envKeysFromSource(readFileSync(file, "utf8"));'
          new_call = 'const keys = envKeysFromSource(readFileSync(file, "utf8"), extname(file));'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one env scanner call, found {text.count(old_call)}')
          source.write_text(text.replace(old_call, new_call, 1))

          tests = Path('tests/convention-enforcement.test.ts')
          test_text = tests.read_text()
          marker = '''  test("requires actionable TODO syntax and rejects FIXME", () => {\n'''
          addition = '''  test("ignores shell-scoped variables assigned internally before embedded runtime use", () => {\n    const root = repository();\n    const scripts = join(root, "scripts");\n    mkdirSync(scripts);\n    writeFileSync(\n      join(scripts, "smoke.sh"),\n      "JSON_EXPR=\\\"$expression\\\" bun --eval 'console.log(process.env.JSON_EXPR)'\\n",\n    );\n    enforce(root, "ENV-003", { kind: "builtin", check: "env-example" });\n\n    expect(runConventionChecks(root, discoverComponents(root)).status).toBe("passed");\n  });\n\n  test("keeps externally overridable shell variables in the environment contract", () => {\n    const root = repository();\n    const scripts = join(root, "scripts");\n    mkdirSync(scripts);\n    writeFileSync(\n      join(scripts, "serve.sh"),\n      "API_URL=\\\"${API_URL:-http://localhost}\\\" node -e 'console.log(process.env.API_URL)'\\n",\n    );\n    enforce(root, "ENV-003", { kind: "builtin", check: "env-example" });\n\n    expect(runConventionChecks(root, discoverComponents(root)).status).toBe("failed");\n    writeFileSync(join(root, ".env.example"), "API_URL=\\n");\n    expect(runConventionChecks(root, discoverComponents(root)).status).toBe("passed");\n  });\n\n'''
          if test_text.count(marker) != 1:
              raise SystemExit('test insertion marker not unique')
          tests.write_text(test_text.replace(marker, addition + marker, 1))
          PY
          bun run format
          bun run lint
          bun run typecheck
          bun test
          git add src/convention-enforcement.ts tests/convention-enforcement.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: ignore internally scoped shell environment variables"
          git push origin HEAD:fix/env-contract-shell-scoped-vars
