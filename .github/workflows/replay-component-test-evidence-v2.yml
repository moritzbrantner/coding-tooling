name: Replay component test evidence implementation

on:
  push:
    branches: [feat/component-test-evidence-v2]
    paths:
      - ".github/workflows/replay-component-test-evidence-v2.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/component-test-evidence-v2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Replay implementation with compatibility alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/component-test-evidence-v2.yml').read_text().splitlines()
          start = source.index('      - name: Implement normalized component test evidence')
          run_line = next(index for index in range(start + 1, len(source)) if source[index].strip() == 'run: |')
          end = source.index('      - name: Commit implementation')
          script = textwrap.dedent('\n'.join(source[run_line + 1:end])) + '\n'
          script, count = re.subn(
              r'(\.\.\.outcome,\n)(\s*)authority: "advisory",',
              r'\1\2state: outcome.status,\n\2authority: "advisory",',
              script,
              count=1,
          )
          if count != 1:
              raise SystemExit('compatibility injection point not found')
          Path('/tmp/replay-component-test-evidence.sh').write_text(script)
          PY
          bash /tmp/replay-component-test-evidence.sh
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/evidence-model.js site/preflight.js site/change-aware.js tests/normalized-evidence.test.js tests/site-preflight.test.js docs/normalized-evidence.md
          git commit -m "Normalize component structural test evidence"
          git push origin HEAD:feat/component-test-evidence-v2
