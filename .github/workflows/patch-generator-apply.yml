name: Patch generator apply

on:
  push:
    branches: [feat/generator-apply]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/generator-apply
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Patch planner and CLI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/generators.ts')
          text = path.read_text()
          text = text.replace(
              'import { existsSync, readdirSync, realpathSync, statSync } from "node:fs";',
              'import { existsSync, readFileSync, readdirSync, realpathSync, statSync } from "node:fs";',
              1,
          )
          old = '''type CreateFileOperation = {
            kind: "create-file";
            template: string;
            path: string;
          };
          '''
          new = '''type CreateFileOperation = {
            kind: "create-file";
            template: string;
            path: string;
          };

          type JsonSetOperation = {
            kind: "json-set";
            path: string;
            key: string;
            value: string;
          };

          type GeneratorOperation = CreateFileOperation | JsonSetOperation;
          '''
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('  operations: CreateFileOperation[];', '  operations: GeneratorOperation[];', 1)
          old = '''export type PlannedGeneratorOperation = {
            generator: string;
            kind: "create-file";
            path: string;
            template: string;
          };
          '''
          new = '''export type PlannedGeneratorOperation =
            | {
                generator: string;
                kind: "create-file";
                path: string;
                template: string;
                content: string;
              }
            | {
                generator: string;
                kind: "json-set";
                path: string;
                key: string;
                value: string;
              };
          '''
          assert old in text
          text = text.replace(old, new, 1)

          start = text.index('  const operations: CreateFileOperation[] = value.operations.map((operation) => {')
          end = text.index('  const compose: GeneratorComposition[]', start)
          block = '''  const operations: GeneratorOperation[] = value.operations.map((operation) => {
            if (!isRecord(operation) || typeof operation.kind !== "string") {
              throw new GeneratorError(
                "invalid-generator",
                `Generator ${value.id} contains an unsupported operation`,
              );
            }
            if (operation.kind === "create-file") {
              if (
                typeof operation.template !== "string" ||
                !managedPath(operation.template) ||
                typeof operation.path !== "string" ||
                !operation.path
              ) {
                throw new GeneratorError(
                  "invalid-generator",
                  `Generator ${value.id} contains an invalid create-file operation`,
                );
              }
              validateInterpolation(operation.path, inputNames);
              return { kind: "create-file", template: operation.template, path: operation.path };
            }
            if (operation.kind === "json-set") {
              if (
                typeof operation.path !== "string" ||
                !operation.path ||
                typeof operation.key !== "string" ||
                !operation.key ||
                typeof operation.value !== "string"
              ) {
                throw new GeneratorError(
                  "invalid-generator",
                  `Generator ${value.id} contains an invalid json-set operation`,
                );
              }
              validateInterpolation(operation.path, inputNames);
              validateInterpolation(operation.key, inputNames);
              validateInterpolation(operation.value, inputNames);
              return {
                kind: "json-set",
                path: operation.path,
                key: operation.key,
                value: operation.value,
              };
            }
            throw new GeneratorError(
              "invalid-generator",
              `Generator ${value.id} contains an unsupported operation`,
            );
          });

          '''
          text = text[:start] + block + text[end:]

          start = text.index('    for (const operation of current.descriptor.operations) {')
          end = text.index('    for (const composition of current.descriptor.compose) {', start)
          block = '''    for (const operation of current.descriptor.operations) {
              const relativePath = render(operation.path, inputs);
              if (!managedPath(relativePath)) {
                throw new GeneratorError(
                  "invalid-generator-output",
                  `Generator ${current.descriptor.id} produced unsafe path ${relativePath}`,
                );
              }
              const output = safePath(target, relativePath, "invalid-generator-output");
              const outputPath = relative(root, output).split(sep).join("/");
              if (operation.kind === "create-file") {
                const template = templatePath(current, operation.template);
                const templateContent = readFileSync(template, "utf8");
                validateInterpolation(templateContent, new Set(Object.keys(current.descriptor.inputs)));
                operations.push({
                  generator: current.descriptor.id,
                  kind: "create-file",
                  path: outputPath,
                  template: relative(root, template).split(sep).join("/"),
                  content: render(templateContent, inputs),
                });
                continue;
              }
              const key = render(operation.key, inputs);
              if (!/^[A-Za-z0-9_-]+(?:\\.[A-Za-z0-9_-]+)*$/.test(key)) {
                throw new GeneratorError(
                  "invalid-generator-output",
                  `Generator ${current.descriptor.id} produced invalid JSON key ${key}`,
                );
              }
              operations.push({
                generator: current.descriptor.id,
                kind: "json-set",
                path: outputPath,
                key,
                value: render(operation.value, inputs),
              });
            }
          '''
          text = text[:start] + block + text[end:]
          path.write_text(text)

          path = Path('src/cli.ts')
          text = path.read_text()
          text = text.replace(
              'import { auditDependencies } from "./dependency-audit.ts";\nimport { generatorCommand } from "./generators.ts";',
              'import { auditDependencies } from "./dependency-audit.ts";\nimport { applyGeneratorCommand } from "./generator-apply.ts";\nimport { generatorCommand } from "./generators.ts";',
              1,
          )
          text = text.replace(
              '  coding-tooling generate plan <id> [--input name=value]... [--target <path>] [--json]`);',
              '  coding-tooling generate plan <id> [--input name=value]... [--target <path>] [--json]\n  coding-tooling generate <id> [--input name=value]... [--target <path>] [--dry-run] [--json]`);',
              1,
          )
          old = '''  } else if (command === "generate") {
            const action = positional[0];
            if (action !== "list" && action !== "describe" && action !== "plan") return usage();
            if ((action === "describe" || action === "plan") && !positional[1]) return usage();
            const inputs = generatorInputs(options);
            if (!inputs) return usage();
            result = generatorCommand(root, action, positional[1], inputs, stringOption(options, "target"));
          } else return usage();
          '''
          new = '''  } else if (command === "generate") {
            const action = positional[0];
            if (!action) return usage();
            const inputs = generatorInputs(options);
            if (!inputs) return usage();
            const target = stringOption(options, "target");
            if (action === "list" || action === "describe" || action === "plan") {
              if ((action === "describe" || action === "plan") && !positional[1]) return usage();
              result = generatorCommand(root, action, positional[1], inputs, target);
            } else {
              result = options["dry-run"]
                ? generatorCommand(root, "plan", action, inputs, target)
                : applyGeneratorCommand(root, action, inputs, target);
            }
          } else return usage();
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/generators.test.ts')
          text = path.read_text()
          needle = '          template: ".coding-tooling/generators/feature/templates/file.tmpl",\n'
          assert needle in text
          text = text.replace(
              needle,
              needle + '          content: "export const value = \'UserProfile\';\\n",\n',
              1,
          )
          path.write_text(text)
          PY
          bun run format:write
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/generators.ts src/cli.ts tests/generators.test.ts src/generator-apply.ts tests/generator-apply.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire atomic generator application"
          git push origin HEAD:feat/generator-apply
