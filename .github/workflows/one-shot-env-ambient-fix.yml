name: One-shot framework ambient env fix

on:
  push:
    branches: ["fix/env-example-framework-ambient"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Apply narrow ENV-003 ambient fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/convention-enforcement.ts')
          source = source_path.read_text()
          old = '  "HOME",\n  "PATH",\n'
          new = '  "HOME",\n  "NEXT_PHASE",\n  "NODE_ENV",\n  "PATH",\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected one ambient insertion point, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/convention-enforcement.test.ts')
          test = test_path.read_text()
          old_test = '      "export const ci = process.env.CI;\\nexport const home = process.env.HOME;\\n",\n'
          new_test = '      "export const ci = process.env.CI;\\nexport const home = process.env.HOME;\\nexport const nodeEnv = process.env.NODE_ENV;\\nexport const nextPhase = process.env.NEXT_PHASE;\\n",\n'
          if test.count(old_test) != 1:
              raise SystemExit(f'expected one ambient test fixture, found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - name: Install dependencies reproducibly
        run: bun install --frozen-lockfile
      - name: Run focused convention enforcement tests
        run: bun test tests/convention-enforcement.test.ts --timeout 15000
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Commit durable slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-env-ambient-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/convention-enforcement.ts tests/convention-enforcement.test.ts .github/workflows/one-shot-env-ambient-fix.yml
          git commit -m "fix: keep framework environment ambient"
          git push origin HEAD:fix/env-example-framework-ambient
